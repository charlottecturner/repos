:root{
  --bg:#EDF0F3;--card:#FFFFFF;--ink:#15202B;--muted:#58646F;--line:#D3DAE1;
  --accent:#2D3A8C;--on-accent:#FFFFFF;--sel:#E3E6FA;
  --red:#B42318;--red-bg:#FCE9E7;--amber:#8F4B00;--amber-bg:#FFF1DC;
  --green:#1D6638;--green-bg:#E5F3E9;--slate:#3F4B57;--slate-bg:#E6EBF0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1319;--card:#18212B;--ink:#E8EDF2;--muted:#9BA8B5;--line:#2B3744;
    --accent:#A3AEFF;--on-accent:#0E1319;--sel:#232B4A;
    --red:#FF9A90;--red-bg:#3A1815;--amber:#FFC069;--amber-bg:#35260F;
    --green:#86DDA0;--green-bg:#12301D;--slate:#BAC6D2;--slate-bg:#232D38;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1319;--card:#18212B;--ink:#E8EDF2;--muted:#9BA8B5;--line:#2B3744;
  --accent:#A3AEFF;--on-accent:#0E1319;--sel:#232B4A;
  --red:#FF9A90;--red-bg:#3A1815;--amber:#FFC069;--amber-bg:#35260F;
  --green:#86DDA0;--green-bg:#12301D;--slate:#BAC6D2;--slate-bg:#232D38;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-weight:700}
#app{max-width:640px;margin:0 auto;padding:0 16px 48px}

.hero h1{font-size:32px;line-height:1.12;margin:30px 0 8px}
.hero p{margin:0 0 22px;color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:14px 16px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--sel)}
.row .main{flex:1;min-width:0}
.row .name{display:block;font-size:19px;font-weight:700;line-height:1.25}
.row .scope{display:block;color:var(--muted);font-size:15px;line-height:1.35;margin-top:2px}
.row .ref{color:var(--muted);font-size:15px;white-space:nowrap}
.row svg{flex:0 0 auto;color:var(--muted)}
.about{margin:26px 0 0;color:var(--muted);font-size:15px}
.about p{margin:0 0 10px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);margin:0 -16px;padding:8px 10px;border-bottom:1px solid var(--line)}
.bar button{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;background:none;border:0;border-radius:10px;color:var(--accent);font-weight:700;cursor:pointer}
.bar .bt{flex:1;text-align:center;font-weight:700;color:var(--muted);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.trail{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--line);padding:5px 10px;margin:0 0 6px;font-size:15px;line-height:1.35;color:var(--muted);cursor:pointer}
.trail b{display:block;color:var(--ink)}
.trails{margin-top:14px}

h1.q{font-size:23px;line-height:1.28;margin:22px 0 8px}
.hint{margin:0 0 16px;color:var(--muted);font-size:16px}
.opt{display:block;width:100%;min-height:58px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;cursor:pointer}
.opt:active{background:var(--sel);border-color:var(--accent)}
.opt .s{display:block;color:var(--muted);font-size:15px;line-height:1.35;margin-top:2px}
.vline{margin:0 0 6px;color:var(--muted);font-size:15px}
.vline a{color:var(--accent)}

.grp{margin:20px 0}
.grp h2{font-size:16px;margin:0 0 8px}
.grp .gh{margin:-4px 0 8px;color:var(--muted);font-size:14px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chips.one{grid-template-columns:1fr}
.chip{min-height:50px;padding:10px 12px;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.cbox{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 12px;margin:0 0 8px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.cbox .box,.tick .box{flex:0 0 24px;height:24px;border:2px solid var(--muted);border-radius:6px;position:relative}
.cbox[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.cbox[aria-pressed="true"] .box,.tick[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.cbox[aria-pressed="true"] .box::after,.tick[aria-pressed="true"] .box::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:rotate(45deg)}
.scorebar{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px -16px 0;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line)}
.scorebar .sc{font-size:15px;color:var(--muted)}
.scorebar .sc b{display:block;font-size:26px;line-height:1.1;color:var(--ink)}
.go{min-height:52px;padding:0 24px;background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;font-weight:700;cursor:pointer}
.go[disabled]{opacity:.4;cursor:default}

.res{margin:18px 0 6px;padding:16px;border-radius:16px;border:1.5px solid;border-left-width:8px}
.res h1{font-size:23px;line-height:1.25;margin:0 0 6px}
.res p{margin:0}
.t-red{background:var(--red-bg);border-color:var(--red)}.t-red h1{color:var(--red)}
.t-amber{background:var(--amber-bg);border-color:var(--amber)}.t-amber h1{color:var(--amber)}
.t-green{background:var(--green-bg);border-color:var(--green)}.t-green h1{color:var(--green)}
.t-slate{background:var(--slate-bg);border-color:var(--slate)}.t-slate h1{color:var(--slate)}
.sec h2{font-size:17px;margin:22px 0 8px}
.chk{list-style:none;margin:0;padding:0}
.tick{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px;cursor:pointer}
.tick .box{margin-top:1px}
.tick .tx{flex:1;min-width:0}
.tick[aria-pressed="true"] .tx{opacity:.6}
.more{margin-top:14px}
.src{margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.src a{color:var(--accent)}
.foot{display:flex;gap:10px;margin:18px 0 0}
.foot button{flex:1;min-height:52px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;font-weight:700;cursor:pointer}
.legal{margin:20px 0 0;color:var(--muted);font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.row{transition:background-color .12s,border-color .12s}}

.gh2{font-size:15px;color:var(--muted);margin:26px 0 8px;font-weight:700}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:400;color:var(--muted);vertical-align:2px}
.srch{display:block;width:100%;box-sizing:border-box;min-height:50px;margin:0 0 14px;padding:10px 14px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.empty{padding:16px;color:var(--muted)}
.flds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 6px}
.fld{display:block}
.fld span{display:block;font-size:14px;color:var(--muted);margin:0 0 4px;line-height:1.25}
.fld input{display:block;width:100%;box-sizing:border-box;min-height:50px;padding:8px 12px;font:inherit;font-size:18px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.grp.wide{grid-column:1/-1;margin:6px 0}
.nb{margin:14px 0}
.nb h2{font-size:18px;line-height:1.3;margin:0 0 6px}
.nb p{margin:0 0 8px;font-size:16px}
.nb p:last-child{margin-bottom:0}
</style>

<script>
/* ---------- DATA ---------- */
var CHECKED = "6 October 2026";

var STOP5 = "Stop antibiotics after 5 days unless microbiology suggests a longer course, or the patient is not clinically stable (fever in the past 48 hours, or more than 1 of: SBP below 90, HR above 100, RR above 24, SpO2 below 90% on air or below their baseline requirement).";

var NEWS2_GROUPS = [
  {k:"rr",type:"sel",label:"Respiratory rate (breaths per minute)",opts:[["25 or above",3],["21 to 24",2],["12 to 20",0],["9 to 11",1],["8 or below",3]]},
  {k:"scale",type:"seg",label:"SpO2 scale",hint:"Use scale 2 only if a clinician has set a target of 88 to 92%, for example in hypercapnic respiratory failure.",opts:[["Scale 1",0],["Scale 2 (target 88 to 92%)",0]],def:0},
  {k:"sp1",type:"sel",label:"Oxygen saturation (scale 1)",show:function(v){return v.scale!==1;},opts:[["96% or above",0],["94 to 95%",1],["92 to 93%",2],["91% or below",3]]},
  {k:"sp2",type:"sel",label:"Oxygen saturation (scale 2)",show:function(v){return v.scale===1;},opts:[["97% or above on oxygen",3],["95 to 96% on oxygen",2],["93 to 94% on oxygen",1],["93% or above on air",0],["88 to 92%",0],["86 to 87%",1],["84 to 85%",2],["83% or below",3]]},
  {k:"air",type:"sel",label:"Air or oxygen",opts:[["Room air",0],["Supplemental oxygen",2]]},
  {k:"sbp",type:"sel",label:"Systolic blood pressure (mmHg)",opts:[["220 or above",3],["111 to 219",0],["101 to 110",1],["91 to 100",2],["90 or below",3]]},
  {k:"hr",type:"sel",label:"Pulse (beats per minute)",opts:[["131 or above",3],["111 to 130",2],["91 to 110",1],["51 to 90",0],["41 to 50",1],["40 or below",3]]},
  {k:"cons",type:"sel",label:"Consciousness",one:true,opts:[["Alert",0],["New confusion, or responds to Voice, Pain, or Unresponsive",3]]},
  {k:"temp",type:"sel",label:"Temperature (degrees C)",opts:[["39.1 or above",2],["38.1 to 39.0",1],["36.1 to 38.0",0],["35.1 to 36.0",1],["35.0 or below",3]]}
];

var MODS = [

/* ===================== SEPSIS ===================== */
{group:"path",id:"sepsis",name:"Suspected sepsis",scope:"Adults 16 and over in hospital. NEWS2 risk bands.",ref:"NG253",
 ver:"NICE NG253, published November 2025. Procalcitonin amendment September 2026.",
 links:[["NG253","https://www.nice.org.uk/guidance/ng253"]],
 start:"pop",
 nodes:{
  pop:{t:"q",q:"Which patient is this?",hint:"This pathway covers acute hospital settings only.",opts:[
    {l:"Aged 16 or over, not pregnant or recently pregnant",s:"Acute hospital setting",go:"how"},
    {l:"Neutropenic, recent anticancer treatment, or immunosuppressed",s:"Anticancer treatment in the last 30 days, or immunosuppressants",go:"neut"},
    {l:"Pregnant or recently pregnant",s:"Includes 24 hours after miscarriage or termination, and 4 weeks after birth",go:"preg"},
    {l:"Under 16",go:"u16"}]},
  neut:{t:"r",tier:"red",title:"Suspected neutropenic sepsis",lead:"Treat as very high risk.",
    secs:[{h:"Do now",items:["Refer immediately for assessment in secondary or tertiary care.","Treat in line with the NICE neutropenic sepsis guideline (CG151), regardless of the cause of immunosuppression."]}],
    ref:"NICE NG253 1.1.10 to 1.1.12; CG151."},
  preg:{t:"r",tier:"slate",title:"Use the pregnancy sepsis guideline",lead:"NG253 does not apply to people who are pregnant or recently pregnant.",
    secs:[{h:"Next step",items:["Follow NICE NG255: suspected sepsis in pregnant or recently pregnant people."]}],ref:"NICE NG253 overview; NG255."},
  u16:{t:"r",tier:"slate",title:"Use the under 16 sepsis guideline",lead:"NG253 does not apply to people under 16.",
    secs:[{h:"Next step",items:["Follow NICE NG254: suspected sepsis in people under 16."]}],ref:"NICE NG253 overview; NG254."},
  how:{t:"q",q:"How do you want to enter the NEWS2?",opts:[
    {l:"Calculate it from the observations",go:"calc"},
    {l:"I already have the NEWS2 score",go:"bands"}]},
  calc:{t:"c",title:"NEWS2",short:"NEWS2",groups:NEWS2_GROUPS,unit:"NEWS2",
    done:function(sum,f){
      var l="NEWS2 "+sum;
      if(sum>=7)return ["high",l];
      if(sum>=5)return [f.three?"c56":"k56",l];
      if(sum>=3)return [f.three?"c34":"k34",l];
      if(sum>=1)return ["k12",l];
      return ["k0",l];}},
  bands:{t:"q",q:"What is the NEWS2 score?",opts:[
    {l:"7 or more",go:"high"},{l:"5 or 6",go:"b56"},{l:"3 or 4",go:"b34"},{l:"1 or 2",go:"k12"},{l:"0",go:"k0"}]},
  b56:{t:"q",q:"Does a single parameter contribute 3 points to the score?",opts:[{l:"Yes",go:"c56"},{l:"No",go:"k56"}]},
  c56:{t:"q",q:"Is the likely cause of the 3 point parameter the current infection?",hint:"Use clinical judgement. A pre-existing condition may explain it.",opts:[
    {l:"Yes, the current infection",go:"high_3"},{l:"No, something else such as a pre-existing condition",go:"mod"}]},
  k56:{t:"q",q:"Is there cause for concern beyond the score?",hint:"Mottled or ashen appearance, non-blanching rash, cyanosis of skin, lips or tongue, or deterioration or no improvement since a previous NEWS2 or an intervention.",opts:[
    {l:"Yes",go:"high_up"},{l:"No",go:"mod"}]},
  b34:{t:"q",q:"Does a single parameter contribute 3 points to the score?",opts:[{l:"Yes",go:"c34"},{l:"No",go:"k34"}]},
  c34:{t:"q",q:"Is the likely cause of the 3 point parameter the current infection?",opts:[
    {l:"Yes, the current infection",go:"d34"},{l:"No, something else such as a pre-existing condition",go:"low"}]},
  d34:{t:"q",q:"After clinical review, which risk level applies?",hint:"NICE says to manage as moderate or high risk. The reviewing clinician decides.",opts:[{l:"Moderate risk",go:"mod"},{l:"High risk",go:"high"}]},
  k34:{t:"q",q:"Is there cause for concern beyond the score?",hint:"Mottled or ashen appearance, non-blanching rash, cyanosis, or deterioration or no improvement since a previous NEWS2 or an intervention.",opts:[
    {l:"Yes",go:"mod_up"},{l:"No",go:"low"}]},
  k12:{t:"q",q:"Is there cause for concern beyond the score?",hint:"Mottled or ashen appearance, non-blanching rash, cyanosis, or deterioration or no improvement since a previous NEWS2 or an intervention.",opts:[
    {l:"Yes",go:"mod_up"},{l:"No",go:"low"}]},
  k0:{t:"q",q:"Is there cause for clinical concern despite a score of 0?",opts:[{l:"Yes",go:"low_0"},{l:"No",go:"vlow"}]},

  high:{t:"r",tier:"red",title:"High risk of severe illness or death from sepsis",
    lead:"Suspected or confirmed infection with NEWS2 of 7 or more, or another route to high risk.",
    secs:[
     {h:"In the first hour",items:[
      "Urgent assessment by a clinician with core acute competencies (FY2 or above). Think about alternative diagnoses to sepsis.",
      "Refer to the senior clinical decision maker (ST3 or above) as soon as possible. Use judgement on whether to discuss with a consultant.",
      "**IV broad-spectrum antibiotics within 1 hour** of the first NEWS2 in ED, or of ward deterioration, if not already given. Choose using local formulary and guidance.",
      "**IV fluid bolus within 1 hour** of identifying high risk, unless contraindicated. Details below.",
      "Venous bloods: gas with glucose and lactate, blood culture, FBC, CRP, U&E, creatinine, LFTs, clotting screen. Consider procalcitonin (added in the 2026 amendment).",
      "Take microbiological samples and bloods before antimicrobials. Start looking for the source of infection."]},
     {h:"Fluids and oxygen",items:[
      "Balanced crystalloid, or 0.9% saline if none is available.",
      "250 ml bolus, ideally over 10 to 15 minutes. Repeat 250 ml if needed, up to 1000 ml in total including fluid already given. Reassess after each bolus.",
      "Not improved enough after 1000 ml: get advice from the senior clinical decision maker.",
      "Oxygen to SpO2 94 to 98%, or 88 to 92% if at risk of hypercapnic respiratory failure."]},
     {h:"Escalation and monitoring",items:[
      "Discuss with critical care (or the senior decision maker if unavailable) whether to give vasopressors, and whether to start peripherally if there is no central access. Make a shared decision on escalation where possible.",
      "Recalculate NEWS2 every 30 minutes.",
      "No response within 1 hour of any intervention: the senior decision maker attends in person, refer to or discuss with critical care, and inform the responsible consultant.",
      "Involve the surgical or interventional radiology team early if the source needs drainage or intervention. Consider urinalysis and chest X-ray for all.",
      "When the source or microbiology is known, review the antibiotics and narrow where appropriate."]}],
    ref:"NICE NG253 1.8.1 to 1.8.15, 1.9.1, 1.10.1, 1.11.2 to 1.11.4."},
  high_3:{t:"r",like:"high",lead:"NEWS2 of 5 or 6 with a single parameter scoring 3 due to the current infection: manage as high risk."},
  high_up:{t:"r",like:"high",lead:"NEWS2 of 5 or 6 with other cause for concern. NICE allows risk to be rated higher than the score alone suggests, so manage as high risk."},
  mod:{t:"r",tier:"amber",title:"Moderate risk of severe illness or death from sepsis",
    lead:"NEWS2 of 5 or 6, or a lower score with a confirmed 3 point parameter or other cause for concern.",
    secs:[
     {h:"In the first hour",items:[
      "Venous bloods: gas with glucose and lactate, blood culture, FBC, CRP, U&E, creatinine, LFTs, clotting screen. Consider procalcitonin.",
      "Review by a clinician with core acute competencies (FY2 or above) of the condition and the lactate result within 1 hour of assessment as moderate risk.",
      "Take microbiological samples. Start looking for the source of infection."]},
     {h:"Antibiotics",items:[
      "Consider deferring broad-spectrum antibiotics for up to 3 hours from the first NEWS2, using the time to gather information for a more specific diagnosis. Discuss with a senior clinical decision maker.",
      "Once the decision to give antibiotics is made, do not delay further."]},
     {h:"Check for hypoperfusion",items:[
      "Lactate above 2 mmol/L or evidence of AKI: treat as high risk (button below).",
      "No hypoperfusion: consider IV fluids after clinical assessment, using the fluid regimen in the high risk pathway."]},
     {h:"Monitoring",items:[
      "Recalculate NEWS2 every hour.",
      "Deterioration or no improvement: escalate to a clinician with core acute competencies (FY2 or above).",
      "Before discharge give information on the definitive condition and the warning signs of sepsis."]}],
    buttons:[{l:"Hypoperfusion present: show high risk actions",go:"high"}],
    ref:"NICE NG253 1.8.16 to 1.8.21, 1.8.27."},
  mod_up:{t:"r",like:"mod",lead:"Cause for concern beyond the score. NICE allows risk to be rated higher than the score alone suggests, so consider managing as moderate risk."},
  low:{t:"r",tier:"green",title:"Low risk of severe illness or death from sepsis",
    lead:"NEWS2 of 1 to 4, or 0 with cause for clinical concern.",
    secs:[
     {h:"Actions",items:[
      "Review by a registered health practitioner within 1 hour of assessment as low risk. Blood tests if indicated.",
      "Request assessment by a clinician with core acute competencies (FY2 or above) to consider deferring broad-spectrum antibiotics for up to 6 hours from the first NEWS2, using the time to gather information for a more specific diagnosis.",
      "Once the decision to give antibiotics is made, do not delay further.",
      "Take microbiological samples. Start looking for the source of infection.",
      "A single parameter scoring 3 due to the current infection: manage as moderate or high risk instead.",
      "Recalculate NEWS2 every 4 to 6 hours. Deterioration or no improvement: escalate.",
      "Before discharge give information on the definitive condition and the warning signs of sepsis."]}],
    ref:"NICE NG253 1.8.22 to 1.8.25, 1.8.27."},
  low_0:{t:"r",like:"low",lead:"NEWS2 of 0 with cause for clinical concern is classed as low risk."},
  vlow:{t:"r",tier:"slate",title:"Very low risk (NEWS2 of 0)",
    lead:"A score of 0 does not mean no risk. The patient still has suspected or confirmed infection.",
    secs:[{h:"Actions",items:[
      "Review by a registered health practitioner. Use clinical judgement and escalate if appropriate.",
      "Take microbiological samples and start looking for the source of infection.",
      "Recalculate NEWS2 with routine observations, in line with local protocol.",
      "Before discharge give information on the definitive condition and the warning signs of sepsis."]}],
    ref:"NICE NG253 1.6.2, 1.8.26, 1.8.27."}
 }},

/* ===================== AKI ===================== */
{group:"path",id:"aki",name:"Acute kidney injury",scope:"Detection, causes, referral and renal replacement.",ref:"NG148",
 ver:"NICE NG148, published December 2019. Contrast media update October 2024.",
 links:[["NG148","https://www.nice.org.uk/guidance/ng148"]],
 start:"menu",
 nodes:{
  menu:{t:"m",title:"Acute kidney injury",items:[
    {l:"Newly detected AKI: what next?",s:"Obstruction, dialysis triggers, nephrology referral",go:"a1"},
    {l:"Who should I check for AKI?",s:"Risk factors and prevention",go:"r_risk"},
    {l:"AKI and iodine contrast",s:"Risk, emergency scans, prevention",go:"r_contrast"},
    {l:"Staging reminder",s:"KDIGO stages",go:"r_kdigo"}]},
  a1:{t:"q",q:"Does the patient meet AKI criteria?",hint:"Creatinine rise of 26 micromol/L or more within 48 hours; or a rise of 50% or more known or presumed within 7 days; or urine output below 0.5 ml/kg/hour for more than 6 hours.",opts:[
    {l:"Yes, criteria met",go:"a2"},{l:"No, or not sure",go:"r_not"}]},
  r_not:{t:"r",tier:"slate",title:"AKI not confirmed",lead:"Measure and compare against baseline if the patient is at risk.",
    secs:[{h:"Next steps",items:[
      "Compare serum creatinine with baseline. Check urine output.",
      "In people with CKD and no obvious acute illness, a creatinine rise may be AKI rather than CKD progression.",
      "See the risk factor list under Who should I check for AKI."]}],
    ref:"NICE NG148 1.1.1, 1.1.3, 1.3.1."},
  a2:{t:"q",q:"Any of these not responding to medical management?",hint:"Hyperkalaemia, metabolic acidosis, symptoms or complications of uraemia (pericarditis, encephalopathy), fluid overload, pulmonary oedema.",opts:[
    {l:"Yes",go:"r_rrt"},{l:"No",go:"a3"}]},
  a3:{t:"q",q:"Suspected urological obstruction?",hint:"Pyonephrosis (infected obstructed kidney), obstructed solitary kidney, bilateral upper tract obstruction, or AKI complications caused by obstruction.",opts:[
    {l:"Yes",go:"r_obst"},{l:"No",go:"a4"}]},
  a4:{t:"q",q:"Does any of these apply?",hint:"No clear cause; possible diagnosis needing specialist treatment (vasculitis, glomerulonephritis, tubulointerstitial nephritis, myeloma); inadequate response to treatment; AKI complications; stage 3 AKI; renal transplant; CKD stage 4 or 5.",opts:[
    {l:"Yes, at least one",go:"r_disc"},{l:"No, clear cause and responding",go:"r_man"}]},
  r_rrt:{t:"r",tier:"red",title:"Possible indication for renal replacement therapy",
    lead:"Hyperkalaemia, acidosis, uraemic complications, fluid overload or pulmonary oedema not responding to medical management.",
    secs:[{h:"Do now",items:[
      "Refer immediately to a nephrologist or critical care specialist, and discuss renal replacement therapy.",
      "Base the decision on the whole clinical picture, not an isolated urea, creatinine or potassium value.",
      "The nephrologist or critical care specialist discusses treatment with the patient (or family) before starting, using shared decision making.",
      "Loop diuretics can be considered for fluid overload or oedema while awaiting renal replacement therapy."]}],
    ref:"NICE NG148 1.5.4, 1.5.6 to 1.5.11."},
  r_obst:{t:"r",tier:"red",title:"Suspected urological obstruction",
    secs:[{h:"Do now",items:[
      "Refer to a urologist. Refer immediately for pyonephrosis, an obstructed solitary kidney, bilateral upper tract obstruction, or obstruction related complications.",
      "Pyonephrosis suspected: immediate ultrasound of the urinary tract, to be done within 6 hours of assessment.",
      "If nephrostomy or stenting is needed, do it as soon as possible and within 12 hours of diagnosis.",
      "Also see the routine management list in the next pathway outcome."]}],
    ref:"NICE NG148 1.4.5, 1.5.1, 1.5.2."},
  r_disc:{t:"r",tier:"amber",title:"Discuss with a nephrologist",
    lead:"As soon as possible, and within 24 hours of detection.",
    secs:[
     {h:"Actions",items:[
      "Discuss management with a nephrologist (stage 3 AKI, no clear cause, possible specialist diagnosis, inadequate response, complications, renal transplant, or CKD 4 to 5).",
      "No identified cause, or at risk of obstruction: urgent ultrasound of the urinary tract, to be done within 24 hours of assessment.",
      "Intensive care patients with an uncertain cause or needing specialist management: refer to a nephrology team.",
      "Haematuria and proteinuria on dipstick without UTI or catheter trauma and no obvious cause: think about acute nephritis and refer to nephrology."]},
     {h:"Basics",items:[
      "Urine dipstick for blood, protein, leucocytes, nitrites and glucose as soon as AKI is suspected. Document results and act on them.",
      "Identify the cause and record it in the notes.",
      "Pharmacist advice on drug optimisation and dosing. Consider stopping ACE inhibitors and ARBs in diarrhoea, vomiting or sepsis until stable.",
      "Monitor creatinine regularly. Daily is typical in hospital."]}],
    ref:"NICE NG148 1.3.2, 1.4.2 to 1.4.6, 1.5.14, 1.5.15."},
  r_man:{t:"r",tier:"green",title:"Manage the cause and monitor",
    lead:"Clear cause and responding promptly to medical management.",
    secs:[
     {h:"Actions",items:[
      "Identify and record the cause. Urine dipstick for blood, protein, leucocytes, nitrites and glucose.",
      "Do not routinely do ultrasound when the cause is identified.",
      "Do not routinely give loop diuretics to treat AKI, and do not give low-dose dopamine.",
      "Pharmacist advice on drugs and doses. Consider temporarily stopping ACE inhibitors and ARBs in diarrhoea, vomiting or sepsis.",
      "Monitor serum creatinine regularly, typically daily in hospital.",
      "Do not refer to a nephrologist when the cause is clear and the AKI is responding promptly, unless the patient has a renal transplant."]},
     {h:"After the episode",items:[
      "Monitor creatinine after recovery, with frequency based on renal function at discharge. Consider nephrology referral if eGFR is 30 or less.",
      "Tell patients at risk about dehydration and drugs that harm the kidney, including over-the-counter NSAIDs."]}],
    ref:"NICE NG148 1.2.14, 1.3.2, 1.4.2, 1.4.4, 1.5.3, 1.5.5, 1.5.12, 1.5.16, 1.6.4."},
  r_risk:{t:"r",tier:"slate",title:"Who to check for AKI",
    lead:"Measure serum creatinine and compare with baseline in adults with acute illness if any of these are likely or present.",
    secs:[
     {h:"Risk factors",items:[
      "CKD (eGFR below 60 is a particular risk), heart failure, liver disease, diabetes, previous AKI.",
      "Oliguria (urine output below 0.5 ml/kg/hour), hypovolaemia, sepsis, deteriorating early warning scores.",
      "Neurological or cognitive impairment or disability limiting access to fluids.",
      "Drugs in the past week: NSAIDs, aminoglycosides, ACE inhibitors, ARBs, diuretics. Iodine contrast in the past week.",
      "Symptoms or history of urological obstruction.",
      "Age 65 or over."]},
     {h:"Prevention",items:[
      "Make sure there is a way to recognise and respond to oliguria if your early warning score does not monitor urine output.",
      "Seek pharmacist advice on optimising and dosing medicines.",
      "Consider temporarily stopping ACE inhibitors and ARBs in diarrhoea, vomiting or sepsis."]}],
    ref:"NICE NG148 1.1.1, 1.2.2, 1.2.13, 1.2.14."},
  r_contrast:{t:"r",tier:"slate",title:"Iodine contrast and AKI",
    secs:[
     {h:"Emergency",items:[
      "Do not delay contrast in an emergency if delay is likely to be clinically significant.",
      "eGFR below 30 carries a small increased risk of contrast associated AKI."]},
     {h:"Non-urgent",items:[
      "Check for pre-existing kidney disease before a non-urgent contrast CT.",
      "Use an eGFR from the past 6 months if available (more recent if the person has been acutely unwell or unstable). If none, ask about kidney disease or transplant, specialist kidney care, and acute illness such as diarrhoea, vomiting, fever, infection or difficulty passing urine.",
      "No kidney disease history and clinically stable: consider proceeding without further bloods."]},
     {h:"Prevention",items:[
      "Inpatients at particularly high risk (eGFR below 30, renal transplant, large or repeat contrast dose within 24 hours, intra-arterial first-pass renal exposure): consider IV volume expansion with isotonic sodium bicarbonate or 0.9% saline.",
      "Consider temporarily stopping ACE inhibitors and ARBs if CKD with eGFR below 30.",
      "Discuss with nephrology before contrast in people on renal replacement therapy, including transplant. Do not delay emergency imaging."]}],
    ref:"NICE NG148 1.1.6 to 1.1.12, 1.2.8 to 1.2.10 (2024 update)."},
  r_kdigo:{t:"r",tier:"slate",title:"KDIGO staging",
    lead:"NG148 refers to the KDIGO, AKIN or RIFLE definitions without reproducing the stages. This table is from KDIGO 2012, not NICE.",
    secs:[{h:"Stages",items:[
      "**Stage 1:** creatinine rise of 26.5 micromol/L or more in 48 hours, or 1.5 to 1.9 times baseline. Urine output below 0.5 ml/kg/hour for 6 to 12 hours.",
      "**Stage 2:** creatinine 2.0 to 2.9 times baseline. Urine output below 0.5 ml/kg/hour for 12 hours or more.",
      "**Stage 3:** creatinine 3 times baseline or more, or 354 micromol/L or above, or renal replacement therapy started. Urine output below 0.3 ml/kg/hour for 24 hours or more, or anuria for 12 hours or more."]}],
    ref:"KDIGO Clinical Practice Guideline for Acute Kidney Injury 2012. Stage 3 triggers nephrology discussion in NICE NG148 1.5.15."}
 }},

/* ===================== CHEST PAIN ===================== */
{group:"path",id:"chest",name:"Chest pain and ACS",scope:"Recent-onset chest pain, STEMI, NSTEMI and stable angina.",ref:"CG95, NG185",
 ver:"NICE CG95 (2010, updated November 2016) and NG185 (2020, minor updates since).",
 links:[["CG95","https://www.nice.org.uk/guidance/cg95"],["NG185","https://www.nice.org.uk/guidance/ng185"]],
 start:"menu",
 nodes:{
  menu:{t:"m",title:"Chest pain and ACS",items:[
    {l:"I have the ECG: what next?",s:"ECG, troponin, then STEMI or NSTEMI management",go:"ecg"},
    {l:"Timing of last pain",s:"For advising GPs or paramedics on referral",go:"start"},
    {l:"Stable chest pain: suspected angina",s:"Typicality and diagnostic testing",go:"sa0"},
    {l:"Immediate management of suspected ACS",s:"Analgesia, aspirin, oxygen, monitoring",go:"r_imm"},
    {l:"GRACE risk bands",s:"Predicted 6 month mortality",go:"r_grace"}]},
  start:{t:"q",q:"When was the last episode of chest pain or discomfort?",hint:"This is the referrer's view, for advising GPs or paramedics. If the patient is already with you, use I have the ECG. Adults. ACS features: pain longer than 15 minutes in the chest or arms, back or jaw; nausea, vomiting, sweating or breathlessness; haemodynamic instability; new or abruptly worse angina with frequent episodes on little exertion.",opts:[
    {l:"Pain now",go:"ecg"},
    {l:"Pain free now, but pain in the last 12 hours",go:"p12"},
    {l:"Last pain 12 to 72 hours ago",go:"r_urg"},
    {l:"Last pain more than 72 hours ago",go:"r_72"}]},
  p12:{t:"q",q:"What is the resting 12-lead ECG?",hint:"Take it as soon as possible. Sending it ahead should not delay transfer.",opts:[
    {l:"Normal",go:"r_urg"},{l:"Abnormal, or not available",go:"ecg"}]},
  ecg:{t:"q",q:"What does the resting 12-lead ECG show?",hint:"Emergency referral if ACS is suspected and the patient has pain now, or pain in the last 12 hours with an abnormal or unavailable ECG. Get a senior review of the ECG. A normal ECG does not exclude ACS.",opts:[
    {l:"ST elevation, or presumed new LBBB",go:"stemi"},
    {l:"ST depression, or deep T wave inversion",go:"nste"},
    {l:"Q waves or T wave changes only",go:"r_susp"},
    {l:"Normal or non-diagnostic",go:"trop"}]},
  trop:{t:"q",q:"What is the high-sensitivity troponin?",opts:[
    {l:"Raised above the 99th centile with a rise or fall",go:"r_mi"},
    {l:"First result positive, patient low risk by a validated tool",go:"r_rep"},
    {l:"First result below the limit of detection, patient low risk by a validated tool",go:"r_rule"},
    {l:"Not low risk, borderline, or still awaited",go:"r_cont"}]},
  stemi:{t:"r",tier:"red",title:"STEMI: reperfusion now",
    lead:"Follow local STEMI protocol until a firm diagnosis is made. Deliver reperfusion as quickly as possible.",
    secs:[
     {h:"Immediately",items:[
      "Assess eligibility for reperfusion straight away, regardless of age, ethnicity or sex.",
      "**Aspirin 300 mg** loading dose as soon as possible unless clear evidence of allergy.",
      "Pain relief: GTN, or IV opioid such as morphine, particularly if MI is suspected.",
      "Do not give routine glycoprotein IIb/IIIa inhibitors or fibrinolytics before the cath lab when primary PCI is planned."]},
     {h:"Choose the reperfusion strategy",items:[
      "**Presenting within 12 hours and primary PCI deliverable within 120 minutes** of when fibrinolysis could have been given: coronary angiography with follow-on primary PCI.",
      "**Presenting within 12 hours and PCI not deliverable within 120 minutes:** offer fibrinolysis, with an antithrombin at the same time. ECG 60 to 90 minutes later. Residual ST elevation suggesting failed reperfusion: immediate angiography with PCI if indicated, and do not repeat fibrinolysis.",
      "Cardiogenic shock within 12 hours: angiography with follow-on PCI if indicated.",
      "More than 12 hours from onset: consider angiography if there is continuing ischaemia (or cardiogenic shock)."]},
     {h:"Antiplatelet and antithrombin",items:[
      "Primary PCI: prasugrel with aspirin if not on an oral anticoagulant. Aged 75 or over: weigh bleeding risk, and consider ticagrelor or clopidogrel instead. Already on an oral anticoagulant: clopidogrel with aspirin.",
      "Primary PCI with radial access: unfractionated heparin with bailout GP IIb/IIIa inhibitor.",
      "STEMI not treated with PCI: ticagrelor with aspirin unless high bleeding risk, then consider clopidogrel or aspirin alone."]}],
    ref:"NICE CG95 1.2.2.2; NG185 1.1.1 to 1.1.26."},
  nste:{t:"r",tier:"amber",title:"NSTEMI or unstable angina pathway",
    lead:"ST depression or deep T wave inversion. Follow NG185 until a firm diagnosis is made.",
    secs:[
     {h:"Initial",items:[
      "**Aspirin 300 mg** as soon as possible unless clear evidence of allergy, then continue indefinitely unless contraindicated.",
      "**Fondaparinux** if no high bleeding risk, unless immediate angiography is planned. Consider unfractionated heparin instead if creatinine is above 265 micromol/L.",
      "Do not give dual antiplatelet therapy for chest pain before a diagnosis of unstable angina or NSTEMI is made.",
      "Once diagnosed and aspirin and antithrombin are offered, use a formal risk score for 6 month mortality, such as GRACE."]},
     {h:"Angiography decision",items:[
      "Clinically unstable: immediate coronary angiography.",
      "Predicted 6 month mortality above 3.0% and no contraindication: consider angiography with PCI if indicated within 72 hours of first admission.",
      "3.0% or below: consider conservative management, with angiography if ischaemia develops or is shown on testing. Some younger people with low scores may still be at high risk.",
      "Unfractionated heparin in the cath lab for anyone having PCI, even if already given fondaparinux."]},
     {h:"Second antiplatelet",items:[
      "Having angiography: prasugrel or ticagrelor with aspirin, unless there is a separate indication for oral anticoagulation, when use clopidogrel. Give prasugrel only once coronary anatomy is defined and PCI is intended. Aged 75 or over: weigh bleeding risk.",
      "PCI not indicated: ticagrelor with aspirin unless high bleeding risk, then consider clopidogrel or aspirin alone."]},
     {h:"Before discharge",items:[
      "Assess left ventricular function after NSTEMI.",
      "ACE inhibitor and beta-blocker once haemodynamically stable. Offer cardiac rehabilitation."]}],
    buttons:[{l:"Show GRACE risk bands",go:"r_grace"}],
    ref:"NICE NG185 1.2.1 to 1.2.22, 1.4.6, 1.4.27, 1.8.1."},
  r_susp:{t:"r",tier:"amber",title:"Increased suspicion of ACS",
    lead:"Q waves or T wave changes raise suspicion of ACS even without ST changes.",
    secs:[{h:"Actions",items:[
      "Consider following NG185 if ACS is likely, and continue monitoring.",
      "Serial resting ECGs, review previous ECGs, consider extra leads.",
      "Check high-sensitivity troponin and interpret with the time from onset, the ECG and the pre-test probability.",
      "Do not exclude ACS on a normal ECG."]}],
    buttons:[{l:"Go to troponin step",go:"trop"}],
    ref:"NICE CG95 1.2.2.4 to 1.2.2.7, 1.2.5.7."},
  r_mi:{t:"r",tier:"red",title:"Raised troponin: confirm the diagnosis",
    secs:[{h:"Actions",items:[
      "Use the universal definition of MI: rise or fall of troponin with at least one value above the 99th centile, plus symptoms of ischaemia, new ST-T changes or new LBBB, new Q waves, imaging evidence, or coronary thrombus.",
      "Reassess for other causes of a raised troponin (for example myocarditis, aortic dissection, pulmonary embolism) before confirming ACS.",
      "Then follow the NSTEMI and unstable angina management in NG185 until a firm diagnosis is made. Keep monitoring."]}],
    buttons:[{l:"Show NSTEMI management",go:"nste"}],
    ref:"NICE CG95 1.2.6.1 to 1.2.6.3."},
  r_rep:{t:"r",tier:"amber",title:"Repeat the troponin",
    secs:[{h:"Actions",items:[
      "At low risk of MI by a validated tool with a positive first high-sensitivity troponin: do a second high-sensitivity troponin, as set out in NICE diagnostics guidance on myocardial infarction.",
      "Explain that a detectable troponin on the first test does not always mean an MI.",
      "Interpret with the clinical picture, time from onset, ECG and pre-test probability."]}],
    ref:"NICE CG95 1.2.5.3, 1.2.5.4, 1.2.5.7."},
  r_rule:{t:"r",tier:"green",title:"NSTEMI may be ruled out on a single test",
    secs:[{h:"Actions",items:[
      "Consider a single high-sensitivity troponin at presentation to rule out NSTEMI when the first test is below the limit of detection and the patient is at low risk by a validated tool.",
      "Then think about other diagnoses (next outcome) and whether ischaemia is still suspected."]}],
    buttons:[{l:"Other causes of chest pain",go:"r_other"}],
    ref:"NICE CG95 1.2.5.3."},
  r_cont:{t:"r",tier:"amber",title:"Keep treating as possible ACS",
    secs:[{h:"Actions",items:[
      "Repeat troponin and ECG per local protocol and NICE diagnostics guidance. Monitor pain, pulse, BP, rhythm, SpO2 and ECGs.",
      "Do not exclude ACS on a normal ECG.",
      "If ACS becomes less likely, consider other acute causes."]}],
    buttons:[{l:"Immediate management",go:"r_imm"},{l:"Other causes of chest pain",go:"r_other"}],
    ref:"NICE CG95 1.2.2.5, 1.2.2.6, 1.2.3.4."},
  r_other:{t:"r",tier:"slate",title:"ACS less likely: consider other causes",
    secs:[{h:"Actions",items:[
      "Consider life threatening causes first: pulmonary embolism, aortic dissection, pneumonia.",
      "Chest X-ray can help exclude pulmonary oedema, pneumothorax or pneumonia.",
      "Use CT chest early only to rule out other diagnoses such as PE or dissection, not to diagnose ACS.",
      "Do not routinely offer non-invasive imaging or exercise ECG in the initial assessment of acute chest pain.",
      "No raised troponin and no acute ECG changes, but ischaemia still suspected: use the stable chest pain pathway."]}],
    ref:"NICE CG95 1.2.2.8, 1.2.6.5 to 1.2.6.8."},
  r_urg:{t:"r",tier:"amber",title:"Referral advice: urgent same-day assessment",lead:"This is advice for a referrer. If you are already seeing the patient in ED, you are that assessment: take the ECG and troponin pathway.",
    secs:[{h:"Applies if ACS is suspected and",items:[
      "Pain in the last 12 hours but now pain free with a normal resting ECG, or the last pain was 12 to 72 hours ago.",
      "Refer for same-day assessment in hospital. Refer as an emergency if they get further chest pain.",
      "Pulmonary oedema or other complications: refer to hospital, using judgement on emergency versus same-day."]}],
    ref:"NICE CG95 1.2.1.8, 1.2.1.9, 1.2.1.11."},
  r_72:{t:"r",tier:"green",title:"Last pain more than 72 hours ago",
    lead:"Suspected recent ACS, no complications such as pulmonary oedema.",
    secs:[{h:"Actions",items:[
      "Detailed clinical assessment.",
      "Confirm the diagnosis with a resting 12-lead ECG and troponin, taking the time since symptoms into account.",
      "Use clinical judgement on whether referral is needed and how urgent. Emergency referral for any further chest pain."]}],
    ref:"NICE CG95 1.2.1.10, 1.2.1.11."},
  r_imm:{t:"r",tier:"slate",title:"Immediate management of suspected ACS",
    lead:"Start as soon as ACS is suspected, but do not delay transfer to hospital.",
    secs:[{h:"Actions",items:[
      "Pain relief as soon as possible: GTN (sublingual or buccal), with IV opioid such as morphine particularly if MI is suspected.",
      "**Aspirin 300 mg** single loading dose as soon as possible unless clear evidence of allergy. Other antiplatelets only in hospital.",
      "Do not give oxygen routinely. Give it if SpO2 is below 94%, aiming for 94 to 98%, or 88 to 92% if at risk of hypercapnic respiratory failure until blood gas results.",
      "Monitor pain, pulse, BP, rhythm, SpO2 and repeat ECGs until a firm diagnosis.",
      "Do not use the response to GTN to make a diagnosis.",
      "Assess symptoms in the same way in men and women, and across ethnic groups."]}],
    ref:"NICE CG95 1.2.1.4 to 1.2.1.6, 1.2.3.1 to 1.2.3.4."},
  r_grace:{t:"r",tier:"slate",title:"Risk bands from predicted 6 month mortality",
    lead:"For use with GRACE or an equivalent score in NSTEMI and unstable angina.",
    secs:[{h:"Bands",items:[
      "1.5% or below: lowest risk.",
      "Above 1.5% to 3.0%: low risk.",
      "Above 3.0% to 6.0%: intermediate risk.",
      "Above 6.0% to 9.0%: high risk.",
      "Above 9.0%: highest risk.",
      "Above 3.0% and no contraindication: consider angiography within 72 hours."]}],
    ref:"NICE NG185 1.2.7 to 1.2.13, table 1."},

  sa0:{t:"q",q:"Does the patient have known coronary artery disease?",hint:"Previous MI, revascularisation or angiography showing CAD.",opts:[
    {l:"Yes",go:"r_cad"},{l:"No",go:"sa1"}]},
  sa1:{t:"c",title:"Typicality of the chest pain",short:"Pain typicality",unit:"Features present",
    groups:[
     {k:"a",type:"chk",label:"Constricting discomfort in the front of the chest, neck, shoulders, jaw or arms",pts:1},
     {k:"b",type:"chk",label:"Precipitated by physical exertion",pts:1},
     {k:"c",type:"chk",label:"Relieved by rest or GTN within about 5 minutes",pts:1}],
    done:function(sum){
      if(sum===3)return ["r_typ","Typical angina (3 of 3)"];
      if(sum===2)return ["r_typ","Atypical angina (2 of 3)"];
      return ["sa2","Non-anginal (0 or 1 of 3)"];}},
  sa2:{t:"q",q:"Does the resting ECG show ST-T changes or Q waves?",hint:"Take a resting 12-lead ECG as soon as possible. A normal ECG does not rule out stable angina.",opts:[
    {l:"Yes",go:"r_typ"},{l:"No",go:"r_non"}]},
  r_typ:{t:"r",tier:"amber",title:"Offer 64-slice CT coronary angiography",
    lead:"Typical or atypical angina, or non-anginal pain with ST-T changes or Q waves on the ECG.",
    secs:[
     {h:"Actions",items:[
      "Offer 64-slice (or above) CT coronary angiography.",
      "Include the typicality of the pain in the request and in the notes.",
      "Blood tests for conditions that worsen angina, such as anaemia. Resting 12-lead ECG if not done.",
      "Consider aspirin only if the pain is likely to be stable angina, until a diagnosis is made.",
      "Do not use exercise ECG to diagnose or exclude stable angina in people without known CAD."]},
     {h:"After the result",items:[
      "Significant CAD (70% or more stenosis of a major epicardial segment, or 50% or more in the left main stem), or reversible ischaemia on functional imaging: confirm stable angina and follow the stable angina guideline.",
      "No significant CAD: investigate other causes of chest pain.",
      "Inconclusive non-invasive functional imaging: invasive coronary angiography as third line."]}],
    ref:"NICE CG95 1.3.3.1 to 1.3.3.15, 1.3.4.1 to 1.3.4.3, 1.3.5.2, 1.3.6.5, 1.3.7.1, 1.3.7.2."},
  r_non:{t:"r",tier:"green",title:"Stable angina can be excluded",
    lead:"Non-anginal pain with no ST-T changes or Q waves on the ECG.",
    secs:[{h:"Actions",items:[
      "Exclude stable angina unless other aspects of the history or risk factors raise clinical suspicion.",
      "Do not offer diagnostic testing for CAD.",
      "Features making angina unlikely: continuous or very prolonged pain, unrelated to activity, brought on by breathing in, or with dizziness, palpitations, tingling or difficulty swallowing.",
      "Consider other causes such as gastrointestinal or musculoskeletal pain. Explain a non-cardiac diagnosis and arrange further investigation if appropriate."]}],
    ref:"NICE CG95 1.3.1.1, 1.3.3.5, 1.3.3.12, 1.1.1.8."},
  r_cad:{t:"r",tier:"amber",title:"Known coronary artery disease",
    lead:"Chest pain is not necessarily cardiac in people with known CAD.",
    secs:[{h:"Actions",items:[
      "Resting 12-lead ECG as soon as possible, and bloods for conditions that worsen angina such as anaemia.",
      "Uncertainty about whether the pain is ischaemic: offer non-invasive functional testing. An exercise ECG may be used instead of functional imaging.",
      "Functional imaging inconclusive: invasive coronary angiography as third line."]}],
    ref:"NICE CG95 1.3.3.14, 1.3.4.4, 1.3.5.2."}
 }},

/* ===================== AF ===================== */
{group:"path",id:"af",name:"Atrial fibrillation",scope:"Acute presentation, stroke prevention and rate control.",ref:"NG196",
 ver:"NICE NG196, published April 2021, last updated June 2021.",
 links:[["NG196","https://www.nice.org.uk/guidance/ng196"]],
 start:"menu",
 nodes:{
  menu:{t:"m",title:"Atrial fibrillation",items:[
    {l:"Acute AF: rate or rhythm control",s:"Instability, onset time, cardioversion, heparin",go:"a1"},
    {l:"Stroke prevention",s:"CHA2DS2-VASc and anticoagulant choice",go:"cha"},
    {l:"Rate control drug choice",s:"First line and combinations",go:"r_rate"}]},
  a1:{t:"q",q:"Is there life-threatening haemodynamic instability caused by new-onset AF?",opts:[
    {l:"Yes",go:"r_dc"},{l:"No",go:"a2"}]},
  a2:{t:"q",q:"Is acute decompensated heart failure suspected?",opts:[
    {l:"Yes",go:"r_hf"},{l:"No",go:"a3"}]},
  a3:{t:"q",q:"How long has the arrhythmia been present?",opts:[
    {l:"Definite onset under 48 hours ago",go:"r_48"},{l:"Over 48 hours, or onset uncertain",go:"r_gt"}]},
  r_dc:{t:"r",tier:"red",title:"Emergency electrical cardioversion",
    lead:"Life-threatening haemodynamic instability caused by new-onset AF.",
    secs:[{h:"Actions",items:[
      "Carry out emergency electrical cardioversion, without delaying to achieve anticoagulation.",
      "Anticoagulation still needs addressing: offer heparin at initial presentation if not anticoagulated and no contraindication, then assess stroke and bleeding risk."]}],
    buttons:[{l:"Stroke prevention",go:"cha"}],
    ref:"NICE NG196 1.8.1, 1.8.8."},
  r_hf:{t:"r",tier:"amber",title:"AF with suspected acute decompensated heart failure",
    secs:[{h:"Actions",items:[
      "Seek senior specialist input on the use of beta-blockers.",
      "Do not use calcium-channel blockers."]}],
    buttons:[{l:"Continue: how long has the AF been present?",go:"a3"}],
    ref:"NICE NG196 1.8.3."},
  r_48:{t:"r",tier:"amber",title:"AF with onset under 48 hours",
    secs:[
     {h:"Strategy",items:[
      "Offer either rate control or rhythm control.",
      "Rhythm control: pharmacological or electrical cardioversion, depending on clinical circumstances and resources.",
      "Pharmacological cardioversion: flecainide or amiodarone if no structural or ischaemic heart disease. Amiodarone if structural heart disease.",
      "Do not use magnesium or a calcium-channel blocker for pharmacological cardioversion."]},
     {h:"Anticoagulation",items:[
      "No or subtherapeutic anticoagulation and no contraindication: offer heparin at initial presentation, and continue it until a full assessment is made and appropriate antithrombotic therapy has started.",
      "Offer oral anticoagulation if sinus rhythm is not restored within 48 hours of onset, if there is a high risk of recurrence (failed cardioversion, structural heart disease, AF for over 12 months, previous recurrences), or if CHA2DS2-VASc indicates it.",
      "Uncertain timing: treat as for persistent AF."]}],
    buttons:[{l:"Stroke prevention: CHA2DS2-VASc",go:"cha"},{l:"Rate control drug choice",go:"r_rate"}],
    ref:"NICE NG196 1.8.2, 1.8.4, 1.8.5, 1.8.7 to 1.8.10."},
  r_gt:{t:"r",tier:"amber",title:"AF over 48 hours, or onset uncertain",
    secs:[
     {h:"Strategy",items:[
      "Offer rate control.",
      "If long-term rhythm control is being considered, delay cardioversion until the patient has had at least 3 weeks of therapeutic anticoagulation. Give rate control in the meantime.",
      "Cardioversion for AF over 48 hours: offer electrical rather than pharmacological.",
      "TOE-guided cardioversion is an option if experienced staff and facilities are available and a minimal period of pre-cardioversion anticoagulation is wanted because of choice or bleeding risk."]},
     {h:"Anticoagulation",items:[
      "New-onset AF with no or subtherapeutic anticoagulation and no contraindication: offer heparin at initial presentation until risk stratification is done and appropriate therapy has started.",
      "Uncertain onset: offer oral anticoagulation as for persistent AF, based on CHA2DS2-VASc and ORBIT."]}],
    buttons:[{l:"Stroke prevention: CHA2DS2-VASc",go:"cha"},{l:"Rate control drug choice",go:"r_rate"}],
    ref:"NICE NG196 1.7.16, 1.7.18, 1.8.2, 1.8.6, 1.8.8, 1.8.10."},
  r_rate:{t:"r",tier:"slate",title:"Rate control drug choice",
    secs:[{h:"Choices",items:[
      "First line: a standard beta-blocker (not sotalol) or a rate-limiting calcium-channel blocker (diltiazem or verapamil). Base the choice on symptoms, heart rate, comorbidities and preferences.",
      "With heart failure: follow the chronic heart failure guideline, which uses beta-blockers and avoids calcium-channel blockers.",
      "Consider digoxin monotherapy in non-paroxysmal AF if the person does no or very little exercise, or other rate-limiting drugs are ruled out.",
      "If monotherapy fails and symptoms are from poor rate control: consider any 2 of beta-blocker, diltiazem, digoxin.",
      "Do not offer amiodarone for long-term rate control.",
      "Do not offer flecainide or propafenone to people with known ischaemic or structural heart disease."]}],
    ref:"NICE NG196 1.7.2 to 1.7.6, 1.7.9."},
  cha:{t:"c",title:"CHA2DS2-VASc",short:"CHA2DS2-VASc",unit:"CHA2DS2-VASc",
    groups:[
     {k:"age",type:"sel",label:"Age",opts:[["Under 65",0],["65 to 74",1],["75 or over",2]]},
     {k:"sex",type:"sel",label:"Sex",opts:[["Male",0],["Female",1]]},
     {k:"chf",type:"chk",label:"Heart failure or left ventricular dysfunction",pts:1},
     {k:"htn",type:"chk",label:"Hypertension",pts:1},
     {k:"dm",type:"chk",label:"Diabetes mellitus",pts:1},
     {k:"str",type:"chk",label:"Previous stroke, TIA or thromboembolism",pts:2},
     {k:"vas",type:"chk",label:"Vascular disease (previous MI, peripheral artery disease, aortic plaque)",pts:1}],
    done:function(sum,f){
      var l="CHA2DS2-VASc "+sum;
      if(sum>=2)return ["r_doac",l];
      if(sum===1&&f.v.sex!==1)return ["r_doac1",l];
      return ["r_noac",l];}},
  r_doac:{t:"r",tier:"green",title:"Offer a direct-acting oral anticoagulant",
    lead:"CHA2DS2-VASc of 2 or above, taking bleeding risk into account.",
    secs:[{h:"Actions",items:[
      "Apixaban, dabigatran, edoxaban or rivaroxaban, used in line with the NICE technology appraisal criteria. Tailor the choice to the person, including renal function, swallowing and adherence. Check the BNF.",
      "Assess bleeding risk with ORBIT. Use it to prompt action on modifiable risks: uncontrolled hypertension, poor INR control, antiplatelets, SSRIs and NSAIDs, harmful alcohol use, reversible anaemia.",
      "Do not withhold anticoagulation solely because of age or falls risk.",
      "A vitamin K antagonist if DOACs are contraindicated, not tolerated or unsuitable. Stable on a VKA: discuss switching at the next routine appointment.",
      "Do not offer aspirin alone for stroke prevention.",
      "Consider left atrial appendage occlusion only if anticoagulation is contraindicated or not tolerated."]}],
    ref:"NICE NG196 1.2.2, 1.2.3, 1.6.1 to 1.6.8, 1.6.14, 1.6.18, 1.6.19."},
  r_doac1:{t:"r",tier:"amber",title:"Consider a DOAC for a man with a score of 1",
    secs:[{h:"Actions",items:[
      "Consider a direct-acting oral anticoagulant (apixaban, dabigatran, edoxaban or rivaroxaban), taking bleeding risk into account using ORBIT.",
      "Discuss benefits and risks with the person. For most people the benefit of anticoagulation outweighs the bleeding risk."]}],
    ref:"NICE NG196 1.2.2, 1.6.1, 1.6.4."},
  r_noac:{t:"r",tier:"slate",title:"Do not offer anticoagulation",
    lead:"Under 65 with no risk factors other than sex: a score of 0 in men, or 1 from female sex alone.",
