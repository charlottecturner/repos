  {h:"Investigations to check",tag:"NICE CG95, HTG552",items:[
   "12-lead ECG as soon as possible, reviewed by someone competent to read it. Repeat if pain recurs or the picture is unclear. Compare with old ECGs.",
   "High-sensitivity troponin through your trust's early rule-out protocol (NICE HTG552, which replaced DG40). Cut-offs are assay specific, so use your local protocol and note the time from symptom onset.",
   "A normal ECG does not exclude ACS. Do not use the response to GTN to make a diagnosis. Assess men, women and all ethnic groups in the same way.",
   "If ACS is less likely, consider PE, aortic dissection, pneumonia and pneumothorax. Chest X-ray where indicated. Do not use CT chest to diagnose ACS.",
   "Do not routinely do exercise ECG or non-invasive imaging in the initial assessment of acute chest pain."]},
  {h:"Before they leave",tag:"NICE CG95",items:[
   "Pain free, normal observations, rule-out pathway complete and documented, and a risk assessment recorded.",
   "Intermittent exertional pain that may be angina: arrange outpatient testing. NICE offers 64-slice CT coronary angiography for typical or atypical angina. Consider aspirin only if the pain is likely to be stable angina.",
   "Explain a non-cardiac cause if that is your conclusion, and give personal advice on when to seek help again."]}],
 ref:"NICE CG95 (updated 2016), NICE HTG552. Verified 6 October 2026.",
 path:["chest","ecg","Open the ECG and troponin pathway"]},

{id:"abd",set:["ed"],name:"Abdominal pain",kw:"abdominal pain abdo belly appendicitis pancreatitis gallstones ectopic aaa",
 why:"The single largest ED complaint in England. Serious causes hide in 'non-specific abdominal pain'.",
 secs:[
  {h:"Do not discharge yet if",tag:"Good practice",items:[
   "Peritonism, guarding or rigidity, or pain that is worsening or needs repeated IV opioids.",
   "Abnormal observations or an unexplained tachycardia or hypotension. Use the sepsis pathway if infection is suspected.",
   "Persistent vomiting or unable to take fluids and oral analgesia.",
   "Back or abdominal pain with collapse, hypotension, or a pulsatile mass, especially over 50: think ruptured AAA.",
   "Any woman of childbearing age with pain and a positive pregnancy test, or a pregnancy not yet located: ectopic until proven otherwise.",
   "Jaundice with fever, or GI bleeding. Irreducible hernia. Testicular pain in a man or boy (torsion).",
   "Older or frail patients with abdominal pain: low threshold for senior review and imaging."]},
  {h:"Investigations to check",tag:"Good practice",items:[
   "Bloods guided by the picture: FBC, CRP, U&E, LFTs, amylase or lipase, lactate on a gas, clotting if liver disease or anticoagulated, group and save if bleeding.",
   "Urinalysis, and a urine pregnancy test in every woman of childbearing age.",
   "ECG in upper abdominal or epigastric pain with cardiac risk factors (inferior MI presents this way).",
   "Imaging only where it changes management: erect chest X-ray for perforation, ultrasound for biliary or gynaecological pain, CT KUB for suspected renal colic, CT abdomen and pelvis for older patients or persistent unexplained pain.",
   "Surgical or gynaecological opinion documented if that is a realistic diagnosis."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Pain controlled on oral analgesia, eating and drinking, and obs normal.",
   "A plan for any pending tests and a named person who will act on them.",
   "Safety net: worsening or new pain, fever, vomiting, blood or black stools, jaundice, not passing wind or urine, collapse. Follow-up within 48 to 72 hours for undifferentiated pain."]}],
 ref:"Clinical consensus (no single NICE pathway). Not rechecked against live guidance. Renal colic: see NICE NG118."},

{id:"sob",set:["ed"],name:"Shortness of breath",kw:"shortness of breath sob dyspnoea breathless respiratory",
 why:"Often several problems at once: asthma, COPD, pneumonia, heart failure, PE, pneumothorax, anaemia, acidosis.",
 secs:[
  {h:"Do not discharge yet if",tag:"Good practice",items:[
   "SpO2 below their target on air, or a drop on walking. Respiratory rate persistently raised, using accessory muscles, or unable to speak in sentences.",
   "New confusion or drowsiness. A silent chest. Peak flow below 75% of best in asthma.",
   "Acidosis or raised CO2 on a gas.",
   "Unexplained hypoxia, or PE likely and not yet imaged.",
   "Pulmonary oedema with hypoxia, or a pneumothorax not yet treated or arranged for follow-up."]},
  {h:"Investigations to check",tag:"Good practice",items:[
   "SpO2 on air at rest and after a short walk. Target 94 to 98%, or 88 to 92% if at risk of hypercapnic respiratory failure (BTS).",
   "Gas (arterial or venous) if hypoxic, drowsy, or known COPD. Use the ABG interpreter in this app.",
   "Chest X-ray, ECG, FBC, U&E, CRP. Peak flow if wheeze. CURB65 if pneumonia.",
   "BNP or NT-proBNP if heart failure is suspected (NICE CG187: BNP below 100 or NT-proBNP below 300 ng/L makes it unlikely).",
   "Wells score then D-dimer or CTPA if PE is possible (NICE NG158)."]},
  {h:"Then use the condition card",tag:"Guide",items:[
   "Asthma, COPD exacerbation, pneumonia, heart failure and PE each have their own discharge checklist in the acute medicine section."]}],
 ref:"BTS oxygen guideline 2017, NICE CG187, NICE NG158. Verified 6 October 2026.",
 path:["pneumonia","menu","Open the pneumonia pathway"]},

{id:"hdache",set:["ed"],name:"Headache",kw:"headache thunderclap subarachnoid sah migraine meningitis giant cell",
 why:"Most are benign. The ones that are not give you a narrow window.",
 secs:[
  {h:"Red flags: do not discharge yet",tag:"NICE NG228 and practice",items:[
   "Thunderclap headache (peaks within 1 to 5 minutes): treat as possible SAH. Refer for urgent non-contrast CT head. NICE says CT accuracy is highest within 6 hours of onset.",
   "Fever, neck stiffness, photophobia or non-blanching rash: meningitis or encephalitis until proven otherwise.",
   "New focal neurology, reduced GCS, seizure, or papilloedema.",
   "New headache over 50 with jaw claudication, scalp tenderness or visual symptoms: check ESR and CRP and think giant cell arteritis.",
   "Pregnant or post-partum, immunosuppressed, cancer, anticoagulated, or head injury.",
   "Red painful eye with halos or reduced vision: acute angle closure. Several people in the household unwell: carbon monoxide."]},
  {h:"Subarachnoid haemorrhage: what NICE says",tag:"NICE NG228",items:[
   "CT head within 6 hours of onset, reported and documented by a radiologist, and negative: do not routinely do a lumbar puncture.",
   "CT more than 6 hours after onset and negative: consider lumbar puncture, at least 12 hours after onset, with spectrophotometry for xanthochromia.",
   "Positive CT: diagnose SAH and offer CT angiography without delay. Be aware that most thunderclap headaches are not SAH."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Full neurological examination including fundi, temperature, BP and glucose documented.",
   "Pain controlled on simple oral analgesia, with a note to avoid medication overuse.",
   "Safety net: worsening or sudden severe headache, vomiting, drowsiness, visual change, fever, neck stiffness, new weakness or speech problems."]}],
 ref:"NICE NG228 verified 6 October 2026. Other red flags are good practice and were not rechecked."},

{id:"back",set:["ed"],name:"Back pain",kw:"back pain cauda equina sciatica spinal",
 why:"Common and usually musculoskeletal. The cost of missing cord compression or cauda equina is high.",
 secs:[
  {h:"Red flags: do not discharge yet",tag:"Good practice",items:[
   "Saddle numbness, new urinary retention or incontinence, bowel dysfunction, or bilateral or progressive leg weakness: suspected cauda equina, so emergency MRI and senior or spinal on-call.",
   "Fever, IV drug use, immunosuppression or recent spinal procedure: infection.",
   "Known or suspected cancer, weight loss, or night pain: metastatic disease or cord compression.",
   "Trauma or low-impact fracture risk (steroids, osteoporosis, older age).",
   "Over 50 with severe pain and collapse or a pulsatile mass: AAA."]},
  {h:"Check before discharge",tag:"Good practice",items:[
   "Lower limb neurology, perianal sensation, anal tone and a bladder scan (post-void residual) if any bladder or bowel symptom.",
   "Temperature and observations. Inflammatory markers if infection or malignancy is possible. Urine dip.",
   "Able to mobilise, passing urine, and analgesia that does not rely on long courses of opioids."]},
  {h:"Safety net",tag:"Good practice",items:[
   "Return urgently for numbness in the saddle area, difficulty passing urine, bowel incontinence, or worsening leg weakness.",
   "Advise staying active. Provide written red flag advice."]}],
 ref:"Good practice. See NICE NG59 for low back pain and sciatica. Not rechecked against live guidance."},

{id:"syn",set:["ed","amu"],name:"Syncope, collapse and dizziness",kw:"syncope collapse blackout tloc faint dizziness dizzy pre-syncope",
 why:"TLoC accounts for a large share of urgent admissions. The risk is a cardiac cause you did not look for.",
 secs:[
  {h:"Do not discharge yet if",tag:"NICE CG109",items:[
   "Any ECG abnormality: NICE says refer for specialist cardiovascular assessment within 24 hours.",
   "Heart failure, collapse during exertion, new or unexplained breathlessness, family history of sudden cardiac death under 40 or an inherited cardiac condition, or an unexplained murmur (see CG109 for the full list).",
   "Consider the same urgent referral for people over 65 with TLoC without prodromal symptoms.",
   "Syncope with chest pain, palpitations, anaemia or GI bleeding, injury, new neurology, or a raised troponin."]},
  {h:"Investigations to check",tag:"NICE CG109, NG249",items:[
   "Record a 12-lead ECG in everyone with suspected TLoC. If automated interpretation is not available, have it reviewed by someone trained to spot the abnormalities.",
   "Lying and standing BP: lie for 5 minutes, then stand and record at 1 and 3 minutes. Positive if systolic falls by 20 mmHg or more, or falls below 90 mmHg.",
   "Capillary glucose, FBC, U&E. Troponin if chest pain or ECG changes. Pregnancy test. Think about head injury criteria if they fell and hit their head.",
   "Uncomplicated faint (posture, provoking factor, prodrome): NICE says no further specialist assessment is needed.",
   "Suspected seizure rather than syncope: use the seizure card."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Clear diagnosis or documented concern, a repeat set of observations, and someone to take them home.",
   "Give DVLA advice. Arrange the follow-up (cardiology, falls clinic, ambulatory ECG) and say so in the letter."]}],
 ref:"NICE CG109 and NG249, RCP FFFAP lying and standing BP procedure. Verified 6 October 2026."},

{id:"falls",set:["ed","amu"],name:"Falls in an older adult",kw:"fall falls older frail long lie elderly mechanical",
 why:"Falls are a leading ED presentation. Discharging after the fracture check alone misses why they fell.",
 secs:[
  {h:"Do not discharge yet if",tag:"Good practice",items:[
   "Cannot weight-bear, or hip pain with normal X-rays: consider occult neck of femur fracture (CT or MRI).",
   "Long lie: check CK and U&E for rhabdomyolysis and AKI.",
   "Head injury meeting NICE NG232 criteria, or on an anticoagulant or antiplatelet (CT may be needed).",
   "New confusion or delirium, an unwitnessed collapse with no explanation, or an ECG abnormality.",
   "No safe environment or support at home."]},
  {h:"Investigations to check",tag:"NICE NG249",items:[
   "Offer comprehensive falls assessment if they could not get up independently, or per the NG249 criteria. Include a cardiovascular examination with lying and standing BP.",
   "ECG, glucose, FBC, U&E. Infection screen guided by symptoms. Urine dipstick is unreliable in older adults.",
   "Medication review: sedatives, antihypertensives, diuretics, anticholinergics, opioids.",
   "Vision, cognition (4AT for delirium), continence, footwear, osteoporosis risk, and mobility with physio or OT."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "A named referral: falls clinic, frailty team or SDEC, with a home hazard assessment where possible.",
   "Practical help in place: carers, mobility aid, alarm. Tell the GP about any medicines you recommend stopping."]}],
 ref:"NICE NG249 (falls) and RCP FFFAP lying and standing BP. Verified 6 October 2026."},

{id:"vd",set:["ed"],name:"Vomiting and diarrhoea",kw:"vomiting diarrhoea gastroenteritis dehydration nausea",
 why:"Common, usually viral, but a mimic for DKA, AKI, obstruction and ACS.",
 secs:[
  {h:"Do not discharge yet if",tag:"Good practice",items:[
   "Cannot keep fluids down after an oral challenge, or has signs of significant dehydration or shock.",
   "AKI on U&E, or a raised lactate.",
   "Blood in stool, severe or localised abdominal pain, distension, or peritonism.",
   "Diabetes with ketones or high glucose. Immunosuppressed, pregnant, or very frail.",
   "Recent hospital stay, antibiotics, or foreign travel with fever."]},
  {h:"Check before discharge",tag:"Good practice",items:[
   "Observations and lying and standing BP. U&E and glucose, plus gas or ketones if diabetic or unwell.",
   "Stool culture only if bloody, prolonged, travel related, or immunosuppressed. Consider C. difficile if recent antibiotics.",
   "Sick day rules: temporarily hold ACE inhibitors, ARBs, diuretics, metformin, SGLT2 inhibitors and NSAIDs while not drinking (NICE NG148 advises considering stopping ACE inhibitors and ARBs in diarrhoea, vomiting or sepsis).",
   "Passed an oral fluid challenge and passing urine."]}],
 ref:"Good practice. NICE NG148 for the AKI and medicines point. Not otherwise rechecked."},

{id:"palp",set:["ed"],name:"Palpitations, AF and SVT",kw:"palpitations af atrial fibrillation svt tachycardia arrhythmia",
 why:"Often benign, but you must capture the rhythm and check for pre-excitation and structural disease.",
 secs:[
  {h:"Do not discharge yet if",tag:"NICE NG196",items:[
   "Life-threatening instability from new-onset AF: NICE says emergency electrical cardioversion without delaying for anticoagulation.",
   "AF with suspected acute decompensated heart failure: seek senior input before beta-blockers, and do not use calcium-channel blockers.",
   "Syncope, chest pain, breathlessness or a broad complex rhythm.",
   "AF over 48 hours where cardioversion is planned and anticoagulation is not in place."]},
  {h:"Investigations to check",tag:"NICE NG196",items:[
   "12-lead ECG, ideally during symptoms. Review a post-conversion ECG for pre-excitation (delta wave) or long QT.",
   "U&E including potassium and magnesium, FBC, TFTs, glucose, and troponin if chest pain. Look for triggers: sepsis, alcohol, thyrotoxicosis, PE, ACS.",
   "Stroke risk: CHA2DS2-VASc. Bleeding risk: ORBIT. Offer a DOAC for a score of 2 or more, taking bleeding risk into account.",
   "New-onset AF with no or subtherapeutic anticoagulation: heparin at presentation unless contraindicated, until risk assessment is done."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Rate controlled at rest, symptoms settled, and an anticoagulation decision made, with supply if started.",
   "Follow-up booked: AF clinic or cardiology, echo, and ambulatory monitoring if paroxysmal."]}],
 ref:"NICE NG196 verified 6 October 2026. Post-conversion ECG advice is good practice.",
 path:["af","a1","Open the AF pathway"]},

{id:"selfharm",set:["ed","amu"],name:"Overdose and self-harm",kw:"overdose self-harm paracetamol poisoning mental health toxbase",
 why:"Medical clearance is only half of discharge. Psychosocial assessment comes before you let them leave.",
 secs:[
  {h:"Medical checks",tag:"Good practice",items:[
   "What, how much, when, any co-ingestants, and any alcohol. Establish whether it was a staggered overdose or the time is unknown.",
   "Use TOXBASE or the National Poisons Information Service for every poison. Do not rely on memory for treatment thresholds.",
   "Paracetamol: level at the time TOXBASE specifies and plotted against the treatment line. Check LFTs, INR and U&E. Treat early if time or amount is uncertain.",
   "ECG (QRS and QTc) for any overdose that may be cardiotoxic. Salicylate level if aspirin or the history is unclear. Capillary glucose."]},
  {h:"Before they leave",tag:"NICE NG225 and practice",items:[
   "A psychosocial assessment by a suitably trained professional before discharge. Do not use risk scores to decide who gets assessed or who can go home.",
   "Capacity assessed, with the Mental Capacity Act and mental health legislation in mind if they want to leave early.",
   "Safeguarding and any children at home considered. Access to means discussed. Someone to go home with where needed.",
   "Crisis contact and a follow-up plan in writing. Tell the GP."]}],
 ref:"Good practice and NICE NG225 (self-harm), not rechecked today. Use TOXBASE for doses and thresholds."},

{id:"seiz",set:["ed","amu"],name:"Seizure or first fit",kw:"seizure fit epilepsy first seizure convulsion",
 why:"Check for a reversible cause and mimics (syncope) before labelling it epilepsy.",
 secs:[
  {h:"Do not discharge yet if",tag:"Good practice",items:[
   "Not back to baseline, ongoing or repeated seizures, or focal deficit.",
   "Head injury with a post-traumatic seizure: NICE NG232 says CT head within 1 hour.",
   "Severe headache, fever, or meningism. Pregnancy. Alcohol withdrawal. Overdose.",
   "Nobody to stay with them."]},
  {h:"Investigations to check",tag:"NICE CG109 and practice",items:[
   "Capillary glucose, U&E with sodium, calcium and magnesium, and a pregnancy test.",
   "12-lead ECG to look for an arrhythmic cause, because syncope is a common mimic (CG109).",
   "Drug and alcohol history. Anticonvulsant adherence in known epilepsy, with levels where relevant.",
   "Imaging if first seizure with focal signs, head trauma, anticoagulation, or no return to baseline."]},
  {h:"Before they leave",tag:"NICE",items:[
   "First seizure: refer for specialist review. NICE advises an epilepsy specialist within 2 weeks.",
   "Give DVLA advice (do not drive), seizure safety advice, and a written account from a witness if possible."]}],
 ref:"NICE CG109 (verified 6 October 2026), NG232 CT criteria. Other items good practice."},

{id:"ana",set:["ed"],name:"Allergic reaction and anaphylaxis",kw:"anaphylaxis allergy allergic reaction adrenaline epipen urticaria angioedema",
 why:"Biphasic reactions happen. Observation time and take-home adrenaline are the discharge standards.",
 secs:[
  {h:"How long to observe",tag:"NICE 2026 update",items:[
   "Consider discharge after 2 hours if: single dose of adrenaline given within 30 minutes of onset with good response, symptoms fully resolved, they already carry auto-injectors and know how to use them, and an adult can supervise.",
   "At least 6 hours after resolution if 2 doses of IM adrenaline were needed, or there is a history of biphasic reaction.",
   "At least 12 hours if more than 2 doses, severe asthma or severe respiratory compromise, ongoing allergen absorption (for example slow-release drug), presenting out of hours, or discharge to an area with poor access to emergency care."]},
  {h:"Investigations to check",tag:"NICE",items:[
   "Mast cell tryptase: first sample as soon as possible after emergency treatment starts, second ideally within 1 to 2 hours (no later than 4 hours) of symptom onset.",
   "Document the clinical features, the time of onset, and the circumstances before it."]},
  {h:"Before they leave",tag:"NICE",items:[
   "Referral to a specialist allergy service.",
   "Prescription for 2 adrenaline auto-injectors with a brand-specific demonstration, unless a drug allergy that is easily avoided.",
   "Information on triggers, the risk of a biphasic reaction, what to do (use the injector, call 999, lie down or sit up if breathless, do not stand suddenly) and patient support groups."]}],
 ref:"NICE anaphylaxis guideline, 2026 update (previously CG134). Verified 6 October 2026."},

{id:"hi",set:["ed"],name:"Head injury",kw:"head injury ct head concussion anticoagulant",
 why:"CT criteria depend on GCS, mechanism, age, anticoagulants and time since injury.",
 secs:[
  {h:"Quick reminders",tag:"NICE NG232",items:[
   "CT head within 1 hour: GCS 12 or less on arrival, GCS below 15 at 2 hours, suspected open or depressed skull fracture, any sign of basal skull fracture, post-traumatic seizure, or more than 1 episode of vomiting.",
   "CT within 8 hours of injury (within 1 hour if presenting after 8 hours) with loss of consciousness or amnesia plus: age 65 or over, bleeding or clotting disorder, dangerous mechanism, or more than 30 minutes retrograde amnesia.",
   "On an anticoagulant or antiplatelet (not aspirin alone) with no other indication: consider CT within 8 hours.",
   "Discharge only when GCS is 15 (or baseline), CT not indicated or normal, no other reason to admit, and a responsible adult can supervise for 24 hours."]}],
 ref:"NICE NG232, verified 6 October 2026.",
 path:["head","h1","Open the adult head injury pathway"]},

{id:"sepsis",set:["ed","amu"],name:"Suspected sepsis",kw:"sepsis infection news2 lactate antibiotics",
 why:"Anyone with infection and abnormal observations: do not discharge until you have a risk level and a plan.",
 secs:[
  {h:"Before discharge",tag:"NICE NG253",items:[
   "Risk level set from NEWS2 plus clinical judgement. Lactate above 2 mmol/L or AKI in a moderate-risk patient means treat as high risk.",
   "Recalculate NEWS2 after treatment. Deterioration or no improvement means escalate.",
   "Low or very low risk: review by a registered practitioner, and consider deferring antibiotics only after a clinician with acute competencies has assessed.",
   "Before discharge, give information on the definitive condition (if found) and the warning signs of sepsis, and make sure they know how to get help."]}],
 ref:"NICE NG253, verified 6 October 2026.",
 path:["sepsis","pop","Open the sepsis pathway"]},

/* ============ ACUTE MEDICINE ============ */

{id:"pneu",set:["amu"],name:"Pneumonia (adult)",kw:"pneumonia cap chest infection curb65 antibiotics",
 why:"Common acute medical admission. NICE gives specific discharge and follow-up standards.",
 secs:[
  {h:"Investigations to check",tag:"NICE NG250",items:[
   "Chest X-ray and antibiotics within 4 hours of arrival. CURB65 recorded with your clinical judgement of severity.",
   "Moderate or high severity: consider blood cultures if sepsis is suspected, sputum culture, pneumococcal urinary antigen, and legionella urinary antigen if risk factors.",
   "High severity: consider IV hydrocortisone. Consider a trial of high-flow nasal oxygen if standard oxygen is not enough.",
   "IV antibiotics reviewed by 48 hours, with a switch to oral if possible. Stop at 5 days unless microbiology or clinical instability says otherwise."]},
  {h:"Do not routinely discharge if",tag:"NICE NG250",items:[
   "Two or more of these in the past 24 hours: temperature above 37.5, respiratory rate 24 or more, heart rate above 100, systolic BP 90 or less, SpO2 below 90% on air (or below baseline requirement), abnormal mental status, or unable to eat without assistance."]},
  {h:"Before they leave",tag:"NICE NG250",items:[
   "Explain recovery: fever settled by 1 week, cough and breathlessness much better by 6 weeks, most symptoms gone by 3 months.",
   "Tell them to seek help if worsening, no improvement within 3 days, or systemically unwell.",
   "No routine follow-up chest X-ray. Consider one at 6 weeks if they smoke or are over 50, have persisting symptoms or unexplained weight loss."]}],
 ref:"NICE NG250 (September 2025, updated 2026), verified 6 October 2026.",
 path:["pneumonia","dis","Open the discharge check"]},

{id:"hf",set:["amu"],name:"Acute heart failure",kw:"heart failure hf oedema bnp diuretic pulmonary oedema",
 why:"Frequent AMU diagnosis and a frequent readmission. Discharge needs a stable patient and a plan.",
 secs:[
  {h:"Investigations to check",tag:"NICE CG187, NG106",items:[
   "BNP below 100 or NT-proBNP below 300 ng/L makes new acute heart failure unlikely. NT-proBNP above 2000 ng/L needs specialist assessment and echo within 2 weeks if outpatient.",
   "ECG, chest X-ray, U&E and eGFR, FBC, glucose, troponin, and TFTs. Echo before or soon after discharge.",
   "IV diuretics are first line. Do not routinely offer opiates or nitrates (NICE CG187).",
   "Admitted patients should have early and continuing input from a specialist heart failure team."]},
  {h:"Before they leave",tag:"NICE CG187, practice",items:[
   "Clinically stable with a management plan in place (NICE NG106). Weight at discharge recorded as a dry weight target.",
   "Established on an oral diuretic regime and observed on it, with U&E and potassium checked after diuresis.",
   "Not hypoxic off oxygen, mobilising, and a cause identified (ischaemia, arrhythmia, infection, non-adherence, drugs such as NSAIDs).",
   "Follow-up clinical assessment by the specialist heart failure team within 2 weeks of discharge (NICE CG187)."]}],
 ref:"NICE CG187 and NG106, verified 6 October 2026. Observation on oral diuretics is good practice."},

{id:"copd",set:["amu"],name:"COPD exacerbation",kw:"copd exacerbation oxygen niv hypercapnia abg bronchitis",
 why:"Oxygen target and the gas decide safety. Discharge needs stable breathing on regular inhalers.",
 secs:[
  {h:"Investigations to check",tag:"BTS, NICE NG115",items:[
   "Target SpO2 88 to 92% while awaiting blood gas results in anyone at risk of hypercapnic respiratory failure. Switch to 94 to 98% only if PaCO2 is normal and they have no history of hypercapnic failure needing ventilation. Repeat the gas 30 to 60 minutes after changing oxygen (BTS 2017).",
   "Gas on admission if SpO2 is below 94% or they are on oxygen. Use the ABG interpreter.",
   "Chest X-ray, ECG, FBC, U&E, CRP. Sputum culture if purulent. Consider pneumonia, PE, pneumothorax and heart failure.",
   "Oral prednisolone 30 mg for 5 days. Antibiotics only for purulent sputum or signs of pneumonia (NICE NG115, NG114). Not rechecked today."]},
  {h:"Do not discharge yet if",tag:"Good practice",items:[
   "Persistent acidosis or rising PaCO2 (consider NIV per BTS/ICS: pH below 7.35 and PaCO2 above 6.5 kPa persisting after about an hour of optimal treatment).",
   "Needing nebulisers more often than 4-hourly, drowsy, hypoxic below their target, or cannot mobilise.",
   "Cannot manage inhalers, or no support at home."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Inhaler technique checked and regular inhalers reviewed. Steroid course supplied and dated.",
   "Oxygen alert card if they have had hypercapnic failure. Smoking cessation offered. Follow-up within about 2 weeks and pulmonary rehabilitation referral."]}],
 ref:"BTS oxygen guideline 2017 (verified 6 October 2026). NICE NG115 and the BTS/ICS NIV threshold are good practice and were not rechecked today."},

{id:"asth",set:["amu","ed"],name:"Acute asthma",kw:"asthma wheeze peak flow pef steroids inhaler",
 why:"Early relapse and readmission are common. Peak flow, steroids and a follow-up plan are the checks.",
 secs:[
  {h:"Do not discharge yet if",tag:"BTS/SIGN 158",items:[
   "Peak flow below 75% of best or predicted. Patients discharged below 75% with diurnal variability over 25% are at higher risk of early relapse.",
   "Features of acute severe or life-threatening asthma persist after treatment.",
   "Received nebulised beta-2 agonist before arrival: consider a longer observation period."]},
  {h:"Before they leave",tag:"BTS/SIGN 158",items:[
   "Oral prednisolone 40 to 50 mg daily until recovery, minimum 5 days.",
   "Supply of inhaled steroid and beta-2 agonist, with inhaler technique checked.",
   "Written personalised asthma action plan, with peak flow and symptom monitoring.",
   "Primary care informed within 24 hours of discharge. GP or asthma nurse follow-up within 2 working days, and specialist asthma nurse or respiratory follow-up at about 1 month.",
   "Asthma education before discharge: inhaler technique, peak flow record keeping."]}],
 ref:"BTS/SIGN 158 asthma guideline (2019), verified 6 October 2026."},

{id:"pe",set:["amu","ed"],name:"Pulmonary embolism and DVT",kw:"pulmonary embolism pe dvt d-dimer wells ctpa anticoagulation hestia",
 why:"Rule it in or out properly. Many low-risk PEs can go home the same day.",
 secs:[
  {h:"Diagnosis",tag:"NICE NG158",items:[
   "Two-level PE Wells score. Likely is more than 4 points. Unlikely is 4 or fewer. Consider the PERC rule when pre-test probability is low.",
   "PE unlikely: D-dimer. Positive goes to CTPA. PE likely: CTPA.",
   "If imaging cannot be done immediately, give interim therapeutic anticoagulation.",
   "Suspected DVT: two-level DVT Wells score. Likely (2 or more) needs proximal leg vein ultrasound, and if that cannot be done within 4 hours, a D-dimer and interim anticoagulation."]},
  {h:"Can they go home?",tag:"NICE NG158, Hestia",items:[
   "NICE supports outpatient treatment of low-risk PE with a validated tool such as Hestia or sPESI.",
   "Hestia: any of these means admit. Haemodynamic instability. Needing thrombolysis or embolectomy. Active bleeding or high bleeding risk. Oxygen needed for more than 24 hours to keep SpO2 above 90%. PE while already anticoagulated. Severe pain needing IV analgesia for more than 24 hours. Medical or social reason for admission. Creatinine clearance below 30. Severe liver impairment. Pregnancy. Previous HIT.",
   "sPESI of 0 (age over 80, cancer, chronic cardiopulmonary disease, HR 110 or more, SBP below 100, SpO2 below 90%) is low risk.",
   "Check renal function before choosing a DOAC. Apixaban or rivaroxaban are first line for DVT and PE (NICE NG158). Dose and supply sorted before leaving."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Anticoagulant started, with a written duration and review. Cancer screen only as clinically indicated.",

/* ---------- ABG calculation ---------- */
function abgCompute(v){
  var out=[];
  var pH=v.ph,pco2=v.pco2,hco3=v.hco3,po2=v.po2,fio2=v.fio2,lac=v.lac,na=v.na,cl=v.cl,alb=v.alb,age=v.age,be=v.be;
  function has(x){return x!==null&&x!==undefined&&!isNaN(x);}
  function r1(x){return (Math.round(x*10)/10).toFixed(1);}
  function r2(x){return (Math.round(x*100)/100).toFixed(2);}
  if(!has(pH)&&!has(po2)&&!has(lac)){return [{tier:"slate",title:"Enter your gas results above",items:["Start with pH, PaCO2 and bicarbonate for the acid-base picture, and PaO2 with FiO2 for oxygenation. Leave out anything you do not have."]}];}
  if(has(pH)&&(pH<6.6||pH>7.8))out.push({tier:"red",title:"Check the values",items:["That pH is outside the range compatible with life. Check you have typed it correctly and that the sample is not mislabelled."]});

  /* Oxygenation */
  if(has(po2)){
    var f=has(fio2)&&fio2>0?fio2:21,fr=f/100,it=[],tier="green",title="Oxygenation";
    var onAir=f<=21.5;
    if(!has(fio2))it.push("FiO2 not entered, so room air (21%) assumed.");
    if(onAir){
      if(po2<8){tier="red";title="Severe hypoxaemia on air";it.push("PaO2 below 8 kPa on air is respiratory failure."); if(has(pco2))it.push(pco2>6.0?"With PaCO2 above 6.0 kPa this is type 2 (hypercapnic) respiratory failure.":"With PaCO2 6.0 kPa or below this is type 1 respiratory failure.");}
      else if(po2<10.6){tier="amber";title="Hypoxaemia on air";it.push("PaO2 below about 10.6 kPa on air is low. Look at the trend and the patient.");}
      else{it.push("PaO2 on air is within the usual range (about 10.6 to 13.3 kPa).");}
    }else{
      var exp=f-10,pf=po2/fr;
      it.push("On "+f+"% oxygen a rough expected PaO2 is about "+r1(exp)+" kPa (FiO2 percentage minus 10).");
      it.push("PaO2/FiO2 ratio: "+r1(pf)+" kPa. Below 40 kPa (300 mmHg) suggests impaired gas exchange. Below 27 kPa (200 mmHg) is severe.");
      if(pf<27){tier="red";title="Severely impaired oxygenation";}
      else if(pf<40){tier="amber";title="Impaired oxygenation";}
      if(po2>15){it.push("PaO2 above about 15 kPa on oxygen suggests hyperoxia. Titrate to the SpO2 target (BTS: 94 to 98%, or 88 to 92% if at risk of hypercapnic failure).");}
    }
    if(has(age)&&has(pco2)){
      var pAO2=fr*(101.3-6.3)-pco2/0.8,aa=pAO2-po2,uln=(age/4+4)/7.5;
      it.push("Approximate A-a gradient: "+r1(aa)+" kPa. Age-adjusted upper limit about "+r1(uln)+" kPa.");
      if(aa>uln){it.push("The gradient is above the age-adjusted limit, which points to V/Q mismatch, shunt or a diffusion problem rather than hypoventilation alone.");if(tier==="green")tier="amber";}
      else{it.push("The gradient is within the age-adjusted limit. If PaO2 is low, think hypoventilation or a low inspired oxygen.");}
    }
    out.push({tier:tier,title:title,items:it});
  }

  /* Acid-base */
  if(has(pH)&&has(pco2)&&has(hco3)){
    var it2=[],tier2="slate",head="",acid=pH<7.35,alk=pH>7.45;
    var hiC=pco2>6.0,loC=pco2<4.7,loB=hco3<22,hiB=hco3>26;
    var primary="";
    if(acid){
      if(hiC&&loB){primary="Mixed respiratory and metabolic acidosis";tier2="red";}
      else if(hiC){primary="Respiratory acidosis";tier2="red";}
      else if(loB){primary="Metabolic acidosis";tier2="red";}
      else{primary="Acidaemia with normal PaCO2 and bicarbonate";tier2="amber";it2.push("Check the numbers and that the sample is arterial. Consider a mixed picture.");}
    }else if(alk){
      if(loC&&hiB){primary="Mixed respiratory and metabolic alkalosis";tier2="amber";}
      else if(loC){primary="Respiratory alkalosis";tier2="amber";}
      else if(hiB){primary="Metabolic alkalosis";tier2="amber";}
      else{primary="Alkalaemia with normal PaCO2 and bicarbonate";tier2="amber";it2.push("Check the numbers and that the sample is arterial.");}
    }else{
      if(!hiC&&!loC&&!loB&&!hiB){primary="Normal acid-base status";tier2="green";}
      else if(hiC&&hiB){primary="Compensated respiratory acidosis";tier2="amber";it2.push("pH is normal because the kidneys have retained bicarbonate. This is typical of chronic CO2 retention, for example in COPD. Treat the oxygen target accordingly.");}
      else if(loC&&loB){primary=pH<7.40?"Compensated metabolic acidosis":"Compensated respiratory alkalosis";tier2="amber";it2.push("A pH of 7.35 to 7.39 favours a primary acidosis. A pH of 7.41 to 7.45 favours a primary alkalosis. Use the clinical context.");}
      else if((hiC&&loB)||(loC&&hiB)){primary="Mixed disorder with opposing effects";tier2="amber";it2.push("PaCO2 and bicarbonate are pushing the pH in opposite directions, so it looks near normal. Look for two separate causes.");}
      else{primary="Normal pH with an isolated PaCO2 or bicarbonate change";tier2="amber";it2.push("This can be an early or mild change, or a mixed disorder. Check the trend.");}
    }
    head=primary+" (pH "+r2(pH)+", PaCO2 "+r1(pco2)+" kPa, HCO3 "+r1(hco3)+" mmol/L)";
    if(pH<7.2)it2.push("Severe acidaemia (pH below 7.2). Involve a senior and critical care early.");
    if(has(be)){
      if(be<-2)it2.push("Base excess "+r1(be)+" confirms a metabolic acidosis component.");
      else if(be>2)it2.push("Base excess "+r1(be)+" confirms a metabolic alkalosis component.");
      else it2.push("Base excess "+r1(be)+" is within the usual range of -2 to +2.");
    }
    var metAcid=loB&&(acid||(pH<7.40&&!hiC));
    if(metAcid){
      var expc=(1.5*hco3+8)/7.5,lo=expc-0.3,hi=expc+0.3;
      it2.push("Winter's formula: expected PaCO2 about "+r1(expc)+" kPa (range "+r1(lo)+" to "+r1(hi)+").");
      if(pco2>hi)it2.push("Measured PaCO2 is higher than expected, so there is an extra respiratory acidosis (inadequate compensation). Think fatigue or hypoventilation.");
      else if(pco2<lo)it2.push("Measured PaCO2 is lower than expected, so there is an extra respiratory alkalosis (for example sepsis, salicylate, pain, PE).");
      else it2.push("Measured PaCO2 is in the expected range, so respiratory compensation is appropriate.");
    }
    if(hiC){
      var d=(pco2-5.3)*7.5,acc=24+0.1*d,chr=24+0.35*d;
      it2.push("For this PaCO2, bicarbonate would be about "+r1(acc)+" if acute and about "+r1(chr)+" if chronic.");
      if(hco3<=acc+2)it2.push("Bicarbonate is near the acute value: acute respiratory acidosis.");
      else if(hco3>=chr-2)it2.push("Bicarbonate is near the chronic value: chronic CO2 retention.");
      else it2.push("Bicarbonate lies between acute and chronic values: acute on chronic respiratory acidosis.");
    }
    /* causes and actions */
    if(acid&&hiC&&!loB){
      it2.push("Common causes: COPD exacerbation, opioids or sedatives, obesity hypoventilation, neuromuscular weakness, chest wall problems, severe asthma tiring.");
      it2.push("Keep SpO2 at 88 to 92% until the CO2 is understood and repeat the gas 30 to 60 minutes after any change in oxygen (BTS).");
      it2.push("COPD exacerbation with pH below 7.35 and PaCO2 above 6.5 kPa persisting after about an hour of optimal medical treatment: consider NIV (BTS/ICS). Follow your local NIV policy and involve a senior.");
    }
    if(metAcid){
      it2.push("Next: measure the anion gap, then lactate and ketones. Raised gap causes: ketones (DKA, alcohol, starvation), uraemia, lactate, toxins (salicylate, methanol, ethylene glycol, metformin).");
      it2.push("Normal gap (hyperchloraemic) causes: diarrhoea, renal tubular acidosis, large volume 0.9% saline, ureteric diversion.");
    }
    if((alk||(!acid&&!alk&&loC))&&loC){
      it2.push("Respiratory alkalosis: anxiety and pain, hypoxia, PE, pneumonia, sepsis, early salicylate toxicity, pregnancy, central causes, over-ventilation.");
    }
    if(hiB&&(alk||hiC===false)){
      it2.push("Metabolic alkalosis: vomiting, nasogastric loss, diuretics, hypokalaemia, volume depletion, mineralocorticoid excess. A low urinary chloride suggests the saline-responsive type.");
    }
    out.push({tier:tier2,title:head,items:it2});
  }else if(has(pH)){
    out.push({tier:"slate",title:"Add PaCO2 and bicarbonate",items:["With pH alone you can say acidaemia or alkalaemia, but not the cause. Enter PaCO2 and HCO3 for the full picture."]});
  }

  /* Anion gap */
  if(has(na)&&has(cl)&&has(hco3)){
    var ag=na-(cl+hco3),it3=[],tier3="green";
    it3.push("Anion gap = Na minus (Cl + HCO3) = "+r1(ag)+" mmol/L. The usual range is about 8 to 12 without potassium, but check your analyser.");
    var agc=ag;
    if(has(alb)){agc=ag+0.25*(40-alb);it3.push("Albumin-corrected gap: "+r1(agc)+" mmol/L."+(alb<36?" Low albumin lowers the measured gap and can hide a raised one.":""));}
    if(agc>12){tier3="amber";it3.push("The gap is raised: a high anion gap metabolic acidosis, or another gap component, is present.");
      if(hco3<24){var dr=(agc-12)/(24-hco3);it3.push("Delta ratio: "+r2(dr)+". Below 0.4 suggests a hyperchloraemic component. 0.4 to 0.8 a mixed high gap and normal gap acidosis. 0.8 to 2 a pure high gap acidosis. Above 2 suggests an additional metabolic alkalosis or pre-existing high bicarbonate.");}
    }else if(hco3<22){it3.push("Normal gap with a low bicarbonate: hyperchloraemic (normal anion gap) metabolic acidosis.");}
    out.push({tier:tier3,title:"Anion gap",items:it3});
  }

  /* Lactate */
  if(has(lac)){
    var it4=[],t4="green",h4="Lactate "+r1(lac)+" mmol/L";
    if(lac>=4){t4="red";it4.push("Lactate of 4 or above is high. Look for shock, sepsis, ischaemia, seizure, or drugs. Involve a senior.");}
    else if(lac>2){t4="amber";it4.push("Lactate above 2 mmol/L is raised. In suspected sepsis, NICE NG253 treats lactate over 2 as evidence of hypoperfusion in a moderate-risk patient, so manage as high risk.");}
    else it4.push("Lactate is within the usual range.");
    it4.push("Repeat after treatment. A falling lactate is reassuring, a rising one is not.");
    out.push({tier:t4,title:h4,items:it4});
  }
  return out;
}

/* ---------- QTc ---------- */
function qtcCompute(v){
  function has(x){return x!==null&&x!==undefined&&!isNaN(x);}
  if(!has(v.qt)||!has(v.hr)||v.hr<=0)return [{tier:"slate",title:"Enter the QT interval and heart rate",items:["Measure the QT from the start of the QRS to the end of the T wave (tangent method) in lead II or V5, in milliseconds."]}];
  var rr=60/v.hr,baz=v.qt/Math.sqrt(rr),fri=v.qt/Math.cbrt(rr);
  var limit=v.sex===1?460:450,it=[],tier="green";
  it.push("Bazett QTc: "+Math.round(baz)+" ms. Fridericia QTc: "+Math.round(fri)+" ms.");
  it.push("Bazett over-corrects when the heart rate is fast and under-corrects when it is slow, so prefer Fridericia above about 90 or below 60 beats per minute.");
  var use=(v.hr>90||v.hr<60)?fri:baz;
  if(use>=500){tier="red";it.push("QTc is 500 ms or more: high risk of torsades. Stop QT-prolonging drugs, correct potassium, magnesium and calcium, and discuss with a senior or cardiology. Do not discharge until addressed.");}
  else if(use>limit){tier="amber";it.push("QTc is prolonged (above "+limit+" ms for this sex). Review drugs and electrolytes and repeat the ECG.");}
  else it.push("QTc is within the usual range (up to "+limit+" ms for this sex).");
  it.push("A normal QTc in a patient with unexplained syncope or a family history of sudden death does not rule out a channelopathy.");
  return [{tier:tier,title:"QTc "+Math.round(use)+" ms",items:it}];
}

     "**Compensation.** Metabolic acidosis: expected PaCO2 is (1.5 x HCO3 + 8) / 7.5 in kPa, plus or minus 0.3 (Winter's formula). Respiratory acidosis: bicarbonate rises about 1 per 1.3 kPa PaCO2 rise if acute, and about 3.5 if chronic.",
     "**Anion gap** for any metabolic acidosis: Na minus (Cl + HCO3). Raised means ketones, uraemia, lactate or toxins.",
     "**Lactate and glucose.** Lactate above 2 is raised. Check glucose and electrolytes (potassium and ionised calcium) from the same gas.",
     "Put it back in context. Compare with previous gases and repeat after treatment."]}],
    ref:"Standard acid-base teaching. Oxygen targets from BTS 2017."},
  r_ven:{t:"r",tier:"slate",title:"Venous versus arterial gas",
    lead:"A venous gas is often enough for pH, bicarbonate, lactate and glucose. It cannot tell you about oxygenation.",
    secs:[{h:"Usual differences (approximate)",items:[
     "Venous pH is about 0.03 lower than arterial.",
     "Venous PCO2 is about 0.8 kPa higher than arterial, and bicarbonate is slightly higher.",
     "A normal venous PCO2 makes hypercapnia unlikely. A raised one needs an arterial gas to confirm.",
     "Venous PO2 and saturation are not useful for judging oxygenation. Use pulse oximetry and an arterial gas if needed.",
     "Lactate, potassium, sodium, glucose and haemoglobin are reliable on a venous sample, but avoid a sample from an arm with a drip running."]}],
    ref:"Standard teaching. Differences are approximate."}
 }},

{group:"tool",id:"ecg",name:"ECG interpreter",scope:"Systematic approach, pattern finder, axis, QTc, and discharge red flags.",ref:"Tool",
 ver:"ST elevation thresholds from the Fourth Universal Definition of Myocardial Infarction (2018). Other content is standard ECG teaching and ALS guidance.",
 links:[["Resuscitation Council UK","https://www.resus.org.uk/library/2021-resuscitation-guidelines"]],
 start:"menu",
 nodes:{
  menu:{t:"m",title:"ECG interpreter",items:[
    {l:"Pattern finder",s:"Tap what you see and get the differential",go:"pat"},
    {l:"Systematic approach",s:"Rate, rhythm, axis, intervals, ST, T",go:"r_sys"},
    {l:"ECG red flags before discharge",s:"Findings that should stop a discharge",go:"r_flags"},
    {l:"Axis",s:"From leads I, II and aVF",go:"ax1"},
    {l:"QTc calculator",s:"Bazett and Fridericia",go:"qtc"},
    {l:"Normal values",s:"Rate, PR, QRS, QT, axis",go:"r_norm"}]},
  pat:{t:"q",q:"What is the main abnormality?",opts:[
    {l:"ST elevation",go:"r_ste"},
    {l:"ST depression or T wave inversion",go:"r_std"},
    {l:"Wide QRS (120 ms or more)",go:"wq"},
    {l:"Narrow QRS and fast (over 100)",go:"nq"},
    {l:"Slow (under 60) or dropped beats",go:"r_brady"},
    {l:"Electrolyte or drug pattern",go:"r_elec"},
    {l:"Something else: PE, pericarditis, Brugada, WPW, long QT",go:"r_other"}]},
  wq:{t:"q",q:"What is the rate?",opts:[
    {l:"Fast (over 100)",s:"Broad complex tachycardia",go:"r_wct"},
    {l:"Normal or slow",s:"Bundle branch block or paced rhythm",go:"r_bbb"}]},
  nq:{t:"q",q:"Is the rhythm regular?",opts:[
    {l:"Regular",go:"r_nctreg"},{l:"Irregularly irregular",go:"r_nctirr"}]},

  r_ste:{t:"r",tier:"red",title:"ST elevation",
    lead:"STEMI criteria: new ST elevation at the J point in 2 contiguous leads, at least 1 mm in all leads except V2 and V3. In V2 and V3 the cut-offs are 2 mm in men aged 40 or over, 2.5 mm in men under 40, and 1.5 mm in women.",
    secs:[
     {h:"Territories",items:[
      "**Anterior** (V1 to V4): LAD. **Lateral** (I, aVL, V5, V6): circumflex or diagonal. **Inferior** (II, III, aVF): usually RCA. Reciprocal ST depression in the opposite leads supports infarction.",
      "Inferior STEMI: record right-sided leads (V4R). RV infarction means be careful with nitrates and fluid-sensitive patients.",
      "ST depression in V1 to V3 with tall R waves: posterior MI. Confirm with V7 to V9 (ST elevation of 0.5 mm or more).",
      "ST elevation in aVR with widespread ST depression: left main or multivessel disease. Treat as high risk."]},
     {h:"Acts like a STEMI even if criteria are not met",items:[
      "Hyperacute (broad, tall) T waves, de Winter pattern (upsloping ST depression with tall T waves in the chest leads), Wellens pattern, posterior MI, and LBBB with Sgarbossa criteria.",
      "Sgarbossa in LBBB: concordant ST elevation of 1 mm or more in leads with a positive QRS (5 points), concordant ST depression of 1 mm or more in V1 to V3 (3 points), and excessive discordant ST elevation (2 points). The Smith-modified version uses ST elevation of 25% or more of the preceding S wave depth."]},
     {h:"Mimics (check the clinical picture)",items:[
      "Pericarditis: diffuse concave ST elevation, PR depression, and PR elevation in aVR. Early repolarisation: young, J point notch, stable. LVH and LBBB (discordant). LV aneurysm (persistent ST elevation with Q waves).",
      "Brugada, takotsubo, hyperkalaemia, PE, hypothermia (Osborn waves), and Prinzmetal angina."]},
     {h:"Do now",items:[
      "Pain with ST elevation: activate your STEMI or primary PCI pathway (NICE NG185). Aspirin 300 mg unless allergic.",
      "Unsure: get a senior or cardiology to look straight away. Repeat the ECG every 15 to 30 minutes if pain continues. Get an old ECG for comparison."]}],
    ref:"Fourth Universal Definition of Myocardial Infarction (2018); NICE NG185. Sgarbossa and mimic lists are standard teaching."},

  r_std:{t:"r",tier:"amber",title:"ST depression or T wave inversion",
    lead:"Ischaemic ST depression is new horizontal or downsloping depression of 0.5 mm or more in 2 contiguous leads, or T inversion over 1 mm with a prominent R wave (Fourth Universal Definition).",
    secs:[
     {h:"Think about",items:[
      "**NSTEMI or unstable angina:** dynamic changes with pain. Serial troponin and ECGs. Follow the NSTEMI pathway.",
      "**Wellens pattern:** biphasic or deeply inverted T waves in V2 and V3 in a pain-free patient who has had chest pain: critical LAD stenosis. Do not stress test. Needs urgent cardiology.",
      "**Posterior MI:** ST depression in V1 to V3 with a dominant R wave.",
      "**Left main or multivessel disease:** widespread ST depression with ST elevation in aVR.",
      "**Pulmonary embolism:** T inversion in V1 to V4 and III, S1Q3T3, sinus tachycardia, right bundle branch block, right axis.",
      "**Others:** LVH with strain (lateral), digoxin (scooped ST), hypokalaemia (flat T, U waves), RBBB or LBBB secondary changes, raised ICP (deep wide inversions), pericarditis in the later stage, takotsubo."]},
     {h:"Do now",items:[
      "Compare with old ECGs. Repeat if pain changes. Troponin per your rule-out protocol. Consider PE and dissection.",
      "Dynamic ST depression with ongoing pain: manage as ACS and involve cardiology."]}],
    ref:"Fourth Universal Definition of Myocardial Infarction (2018); standard ECG teaching."},

  r_wct:{t:"r",tier:"red",title:"Broad complex tachycardia",
    lead:"Treat as ventricular tachycardia until proven otherwise, especially in older patients or those with heart disease.",
    secs:[
     {h:"Unstable (shock, syncope, ischaemia, heart failure)",items:[
      "Synchronised DC cardioversion per the ALS peri-arrest tachycardia algorithm. Call for help. Resuscitation Council UK guidance applies."]},
     {h:"Stable",items:[
      "Senior and cardiology help. 12-lead ECG, bloods (K, Mg, Ca), and an old ECG if available.",
      "Features favouring VT: AV dissociation, capture or fusion beats, very wide QRS (over 140 ms), concordance across the chest leads, and an extreme (northwest) axis.",
      "Do not give verapamil or diltiazem to a broad complex tachycardia of unknown cause.",
      "Regular broad complex tachycardia with a known bundle branch block may be SVT with aberrancy, but treat as VT if there is any doubt."]},
     {h:"Irregular broad complex",items:[
      "AF with bundle branch block. Pre-excited AF (WPW): avoid AV nodal blockers (adenosine, beta-blockers, calcium-channel blockers, digoxin). Seek specialist advice or cardiovert.",
      "Polymorphic VT with long QT (torsades): ALS recommends IV magnesium 2 g over 10 minutes, correct potassium, and stop QT-prolonging drugs."]}],
    ref:"Resuscitation Council UK ALS peri-arrest arrhythmia algorithm. Check the current algorithm and local policy for doses."},

  r_bbb:{t:"r",tier:"amber",title:"Bundle branch block and wide QRS",
    secs:[{h:"Recognise",items:[
      "**LBBB:** QRS 120 ms or more, broad notched R in I, aVL, V5, V6 and a deep S in V1. New LBBB with ischaemic symptoms: assess with Sgarbossa criteria and involve cardiology.",
      "**RBBB:** rSR' in V1 to V2, wide S wave in I and V6. T inversion in V1 to V3 is expected. New RBBB with sinus tachycardia and right axis: think PE.",
      "**Bifascicular block** (RBBB plus left anterior or posterior hemiblock) or trifascicular: syncope with these is high risk for high-degree AV block.",
      "**Paced rhythm:** pacing spikes before wide QRS. ST changes are hard to interpret.",
      "Wide QRS with a normal rate can also be hyperkalaemia, sodium channel blocker toxicity (tricyclics), or a ventricular rhythm."]},
     {h:"Before discharge",items:["New LBBB, new bifascicular block with syncope, or wide QRS from hyperkalaemia or toxicity should stop the discharge until reviewed."]}],
    ref:"Standard ECG teaching."},

  r_nctreg:{t:"r",tier:"amber",title:"Regular narrow complex tachycardia",
    secs:[
     {h:"Differential",items:[
      "**Sinus tachycardia:** P before every QRS, rate usually below 150. Find the cause (pain, sepsis, bleeding, PE, anxiety, thyroid, drugs).",
      "**AVNRT or AVRT:** abrupt onset and offset, rate 150 to 250, often no visible P waves.",
      "**Atrial flutter with 2:1 block:** ventricular rate often about 150. Look for sawtooth flutter waves in the inferior leads.",
      "**Atrial tachycardia.**"]},
     {h:"Management (stable)",items:[
      "Vagal manoeuvres first, such as the modified Valsalva (strain in a semi-recumbent position for 15 seconds, then lie flat and raise the legs).",
      "If that fails, ALS recommends adenosine 6 mg rapid IV bolus, then 12 mg, then 12 mg. Warn about the transient flushing and chest tightness. Avoid in severe asthma or in pre-excited AF.",
      "Record a 12-lead ECG during any conversion, and a post-conversion ECG (look for a delta wave)."]},
     {h:"Unstable",items:["Synchronised DC cardioversion per the ALS algorithm."]}],
    ref:"Resuscitation Council UK ALS peri-arrest tachycardia algorithm. Check the current algorithm for doses."},

  r_nctirr:{t:"r",tier:"amber",title:"Irregular narrow complex tachycardia",
    secs:[{h:"Differential",items:[
      "**Atrial fibrillation:** irregularly irregular, no P waves. See the AF pathway for management (NICE NG196).",
      "**Atrial flutter with variable block.**",
      "**Multifocal atrial tachycardia:** at least 3 different P wave shapes, often in COPD.",
      "Sinus rhythm with frequent ectopics can look irregular."]},
     {h:"Do now",items:[
      "Life-threatening instability: emergency electrical cardioversion without delaying for anticoagulation.",
      "Otherwise: look for triggers, check electrolytes and TFTs, assess CHA2DS2-VASc, and follow the AF pathway."]}],
    buttons:[{l:"Open the AF pathway",go:"@af:a1"}],
    ref:"NICE NG196."},

  r_brady:{t:"r",tier:"amber",title:"Bradycardia and AV block",
    secs:[
     {h:"Recognise",items:[
      "**First-degree block:** PR over 200 ms, every P conducted. Usually benign.",
      "**Mobitz I (Wenckebach):** progressively lengthening PR then a dropped beat. Often benign, seen with high vagal tone and inferior MI.",
      "**Mobitz II:** fixed PR with intermittent dropped QRS. Risk of progression to complete block, needs pacing assessment.",
      "**Third-degree block:** P waves and QRS complexes independent of each other. A wide ventricular escape is less stable than a narrow junctional escape."]},
     {h:"Causes to look for",items:["Inferior MI, drugs (beta-blockers, calcium-channel blockers, digoxin), hyperkalaemia, hypothyroidism, hypothermia, raised intracranial pressure, sepsis, and infiltrative or degenerative disease."]},
     {h:"Management",items:[
      "Adverse features (shock, syncope, myocardial ischaemia, heart failure): ALS recommends atropine 500 micrograms IV, repeated up to a maximum of 3 mg, then transcutaneous pacing or adrenaline infusion if no response.",
      "Risk of asystole (recent asystole, Mobitz II, complete block with a wide escape, ventricular pause over 3 seconds): arrange pacing.",
      "Do not discharge new Mobitz II or complete heart block."]}],
    ref:"Resuscitation Council UK ALS bradycardia algorithm. Check the current algorithm for doses."},

  r_elec:{t:"r",tier:"amber",title:"Electrolyte and drug patterns",
    secs:[
     {h:"Potassium",items:[
      "**Hyperkalaemia:** tall narrow symmetrical (peaked) T waves, then flat P waves, prolonged PR, widened QRS, and finally a sine wave or VF. The ECG does not always match the level, so treat the changes.",
      "ECG changes with a high potassium means emergency treatment per your hyperkalaemia guideline (IV calcium, insulin with glucose, salbutamol).",
      "**Hypokalaemia:** ST depression, flat or inverted T waves, prominent U waves, and ventricular ectopy."]},
     {h:"Calcium and magnesium",items:[
      "**Hypocalcaemia:** prolonged ST segment and QT. **Hypercalcaemia:** short QT, and J waves in extreme cases. **Hypomagnesaemia:** prolonged QT and torsades."]},
     {h:"Drugs and toxins",items:[
      "**Digoxin:** reverse-tick (scooped) ST depression, ventricular ectopy, bidirectional VT, and AV block with an atrial tachycardia. Toxicity can occur with a normal level.",
      "**Tricyclic overdose:** sinus tachycardia, QRS over 100 ms, and a terminal R wave in aVR. Check TOXBASE for treatment, which includes sodium bicarbonate.",
      "**QT-prolonging drugs:** macrolides, antipsychotics, antiemetics (ondansetron), quinolones, methadone, citalopram.",
      "**Hypothermia:** bradycardia, shivering artefact, and Osborn (J) waves."]}],
    ref:"Standard ECG teaching. Use TOXBASE and your local guidelines for treatment and doses."},

  r_other:{t:"r",tier:"amber",title:"Other patterns worth knowing",
    secs:[
     {h:"Patterns",items:[
      "**Pulmonary embolism:** sinus tachycardia is the commonest finding. S1Q3T3, T inversion V1 to V4, right bundle branch block, and right axis are supportive, not diagnostic.",
      "**Pericarditis:** diffuse concave ST elevation, PR depression (with PR elevation in aVR), no reciprocal change. Low voltage and electrical alternans suggest a large effusion or tamponade.",
      "**Brugada:** type 1 has coved ST elevation of 2 mm or more in V1 or V2 followed by T inversion. Fever and sodium channel blockers can unmask it. Syncope with this pattern needs cardiology.",
      "**WPW (pre-excitation):** short PR (under 120 ms) with a delta wave. If AF develops, avoid AV nodal blockers.",
      "**Long QT:** QTc above 450 ms (men) or 460 ms (women), and 500 ms or more is high risk. Use the QTc calculator.",
      "**HOCM:** deep narrow Q waves in lateral and inferior leads with LVH voltage.",
      "**ARVC:** epsilon wave and T inversion in V1 to V3. **LVH:** S in V1 plus R in V5 or V6 over 35 mm, often with strain."]}],
    ref:"Standard ECG teaching."},

  r_flags:{t:"r",tier:"red",title:"ECG findings that should stop a discharge",
    lead:"If you see any of these, get a senior or cardiology opinion before the patient leaves.",
    secs:[{h:"Stop and discuss",items:[
      "ST elevation, new LBBB, or ischaemic ST depression or deep T inversion with symptoms. Wellens pattern.",
      "Hyperacute T waves, de Winter pattern, or posterior MI pattern.",
      "Mobitz II or complete heart block. New bifascicular block with syncope.",
      "QTc of 500 ms or more. Brugada type 1 pattern. Pre-excitation with syncope or AF.",
      "Ventricular tachycardia, frequent ventricular ectopy with symptoms, or an epsilon wave.",
      "Peaked T waves or a widened QRS with a high potassium.",
      "Right heart strain pattern with hypoxia or a high PE probability.",
      "Low voltage with electrical alternans (tamponade) or diffuse ST elevation with chest pain not yet explained.",
      "New AF with instability, or fast AF or flutter not yet rate controlled."]}],
    ref:"Standard ECG teaching and CG109 (ECG abnormality in syncope needs specialist assessment within 24 hours)."},

  r_sys:{t:"r",tier:"slate",title:"Systematic approach",
    lead:"Standard paper speed is 25 mm per second: one small square is 40 ms and one large square is 200 ms. Calibration is 10 mm per millivolt.",
    secs:[{h:"In this order",items:[
      "**Patient and calibration.** Name, date and time. Check speed and gain. Compare with previous ECGs.",
      "**Rate.** Regular: 300 divided by the number of large squares between R waves. Irregular: count QRS complexes in 6 seconds and multiply by 10.",
      "**Rhythm.** Is there a P wave before every QRS, and a QRS after every P? Regular or irregular? Narrow or wide?",
      "**Axis.** Leads I and aVF (see the axis tool). Normal is -30 to +90 degrees.",
      "**Intervals.** PR 120 to 200 ms. QRS under 120 ms. QTc up to about 450 ms (men) or 460 ms (women).",
      "**P waves.** Shape and width (under 120 ms and under 2.5 mm). Absent in AF.",
      "**QRS.** Pathological Q waves (wider than 40 ms or deeper than a quarter of the R wave, in more than one lead apart from III and aVR). R wave progression. Voltage. Bundle branch block.",
      "**ST segments.** Elevation or depression, and the leads they are in.",
      "**T waves and U waves.** Peaked, flat, inverted, hyperacute.",
      "**Put it together.** Does it fit the patient? Is it new? Repeat if the picture changes."]}],
    ref:"Standard ECG teaching."},

  r_norm:{t:"r",tier:"slate",title:"Normal values",
    secs:[{h:"Adults",items:[
      "Heart rate 60 to 100 beats per minute.",
      "PR interval 120 to 200 ms (3 to 5 small squares).",
      "QRS duration under 120 ms (under 3 small squares).",
      "QTc: up to about 450 ms in men and 460 ms in women. 500 ms or more is high risk.",
      "Axis: -30 to +90 degrees.",
      "P wave: under 120 ms and under 2.5 mm.",
      "ST elevation thresholds for STEMI: 1 mm in most leads, and 2 mm (men 40 or over), 2.5 mm (men under 40), or 1.5 mm (women) in V2 and V3."]}],
    ref:"ESC and Fourth Universal Definition of Myocardial Infarction (2018)."},

  ax1:{t:"q",q:"Lead I: is the QRS mainly positive?",opts:[{l:"Positive",go:"ax2p"},{l:"Negative",go:"ax2n"}]},
  ax2p:{t:"q",q:"aVF: is the QRS mainly positive?",opts:[{l:"Positive",go:"r_axn"},{l:"Negative",go:"ax3"}]},
  ax3:{t:"q",q:"Lead II: is the QRS mainly positive?",opts:[{l:"Positive",go:"r_axn"},{l:"Negative",go:"r_lad"}]},
  ax2n:{t:"q",q:"aVF: is the QRS mainly positive?",hint:"Check first that the P wave in lead I is upright. An inverted P wave in lead I suggests limb lead reversal or dextrocardia.",opts:[{l:"Positive",go:"r_rad"},{l:"Negative",go:"r_ext"}]},
  r_axn:{t:"r",tier:"green",title:"Normal axis",lead:"About -30 to +90 degrees.",secs:[{h:"Note",items:["Lead I and aVF both positive is normal. Lead I positive with a negative aVF but a positive lead II is still within normal limits."]}],ref:"Standard ECG teaching."},
  r_lad:{t:"r",tier:"amber",title:"Left axis deviation",lead:"Beyond -30 degrees.",secs:[{h:"Causes",items:["Left anterior fascicular block, inferior MI, LVH, LBBB, WPW (left-sided pathway), hyperkalaemia, and some congenital conditions."]}],ref:"Standard ECG teaching."},
  r_rad:{t:"r",tier:"amber",title:"Right axis deviation",lead:"Beyond +90 degrees.",secs:[{h:"Causes",items:["Right ventricular hypertrophy, pulmonary embolism, acute right heart strain, left posterior fascicular block, lateral MI, chronic lung disease, and dextrocardia or limb lead reversal if lead I is globally negative."]}],ref:"Standard ECG teaching."},
  r_ext:{t:"r",tier:"amber",title:"Extreme (northwest) axis",lead:"Between -90 and 180 degrees.",secs:[{h:"Causes",items:["Ventricular tachycardia or a ventricular rhythm, hyperkalaemia, pacing, severe lung disease, and limb lead misplacement. Check the lead placement and the rhythm."]}],ref:"Standard ECG teaching."},

  qtc:{t:"n",title:"QTc calculator",short:"QTc",
    hint:"Measure the QT from the start of the QRS to the end of the T wave in lead II or V5.",
    fields:[
     {k:"qt",label:"QT interval (ms)",ph:"400",step:"1"},
     {k:"hr",label:"Heart rate (bpm)",ph:"70",step:"1"},
     {k:"sex",label:"Sex",type:"sel",opts:["Male","Female"]}],
    compute:qtcCompute}
 }}
];
