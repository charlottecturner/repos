var CARDS2 = [

/* ===================== PAEDIATRIC ED ===================== */

{id:"p_all",set:["paeds"],name:"Every child: before discharge",kw:"paediatric child universal discharge safety net safeguarding weight",
 why:"Run through this for any child you are about to send home.",
 secs:[
  {h:"Before they go",tag:"NICE NG143 and practice",items:[
   "A full set of observations recorded and read against age-specific ranges, not adult ones. Heart rate, respiratory rate, SpO2, temperature, capillary refill and alertness.",
   "Weight recorded. Every dose calculated per kg and checked against the BNF for children.",
   "Take parental concern and your own instinct seriously. NICE says a parent's report of fever is valid and that parental anxiety and instinct are reasons to consider admission.",
   "Consider admission if: difficult social or family circumstances, others in the family unwell, contact with serious infection, recent travel to a high-risk area, repeated attendance with the same illness, a previous serious illness or death in the family from feverish illness, or an illness lasting longer than expected.",
   "Who is looking after the child at home? Is there a responsible adult, a phone, transport, and a way to come back? Interpreter needed?",
   "Safeguarding: do the history and injuries fit the child's age and development? Any delay in presentation? Frequent attendance? Check for an existing child protection plan or looked-after status through your local flag system.",
   "Feeding and hydration: feeding adequately and passing urine.",
   "A fall in temperature after an antipyretic does not mean the child is well. Do not rely on it to reassure (NICE NG143)."]},
  {h:"Safety net and follow-up",tag:"NICE NG143",items:[
   "If no diagnosis is reached and any red or amber features are present, give a safety net: verbal or written warning signs and how to get care, follow-up at a named time and place, or direct access arranged through other services.",
   "Advise parents to return or seek help if the child has a fit, develops a non-blanching rash, seems less well, or the parent is more worried, if fever lasts 5 days or more, or if the parent feels unable to cope.",
   "Tell the GP and health visitor, and book any follow-up that is still needed."]}],
 ref:"NICE NG143, rechecked 15 October 2026. Safeguarding and dosing items are good practice."},

{id:"p_fever",set:["paeds"],name:"Fever in a child under 5",kw:"fever febrile child baby infant temperature traffic light kawasaki",
 why:"NICE traffic light assessment. The age under 3 months and the red features decide almost everything.",
 secs:[
  {h:"Red features: high risk, do not discharge without senior paediatric review",tag:"NICE NG143",items:[
   "Pale, mottled, ashen or blue colour. No response to social cues. Appears ill to a healthcare professional. Does not wake, or if roused does not stay awake. Weak, high-pitched or continuous cry.",
   "Grunting. Respiratory rate over 60 per minute. Moderate or severe chest indrawing.",
   "Reduced skin turgor. Bulging fontanelle. Neck stiffness.",
   "Age under 3 months with temperature 38 degrees C or above (recent vaccination can cause fever in under 3 months). Non-blanching rash. Status epilepticus, focal neurological signs, or focal seizures.",
   "Life-threatening features (airway, breathing, circulation, reduced consciousness): emergency care. Think 'could this be sepsis?' and use the under 16 sepsis guidance."]},
  {h:"Amber features: intermediate risk",tag:"NICE NG143",items:[
   "Pallor reported by parent. Not responding normally to social cues. No smile. Wakes only with prolonged stimulation. Decreased activity.",
   "Nasal flaring. Respiratory rate over 50 (6 to 12 months) or over 40 (over 12 months). SpO2 95% or below in air. Crackles.",
   "Heart rate over 160 (under 12 months), over 150 (12 to 24 months), over 140 (2 to 5 years). Capillary refill 3 seconds or longer. Dry mucous membranes. Poor feeding in infants. Reduced urine output.",
   "Age 3 to 6 months with temperature 39 degrees C or above. Fever for 5 days or more. Rigors. Swelling of a limb or joint. Not using a limb or not weight-bearing."]},
  {h:"Investigations",tag:"NICE NG143",items:[
   "Under 3 months: FBC, blood culture, CRP, and urine for UTI. Chest X-ray only if respiratory signs. Stool culture if diarrhoea. Lumbar puncture for all under 1 month, all 1 to 3 months who appear unwell, and those aged 1 to 3 months with a white cell count below 5 or above 15 (x10^9/L). Parenteral antibiotics for the same groups: a third-generation cephalosporin plus cover for Listeria.",
   "Any red feature and no apparent source: FBC, blood culture, CRP and urine. Consider lumbar puncture, chest X-ray, and electrolytes and a gas.",
   "Any amber feature and no apparent source: urine, FBC, CRP and blood culture unless an experienced paediatrician judges them unnecessary. Consider lumbar puncture under 1 year.",
   "Green and no source: test urine and look for pneumonia. Do not routinely do blood tests or a chest X-ray.",
   "Shock: NICE NG143 gives an immediate IV bolus of 10 ml/kg 0.9% sodium chloride, and immediate parenteral antibiotics if shocked, unrousable or showing signs of meningococcal disease. Check your trust's sepsis pathway for current volumes."]},
  {h:"Fever for 5 days or more",tag:"NICE NG143",items:[
   "Think of Kawasaki disease. Ask about bilateral conjunctival injection without exudate, red cracked lips or strawberry tongue, swollen red hands and feet, polymorphous rash and cervical lymphadenopathy. They may have gone by the time you see the child. Infants may have fewer features but higher risk of coronary artery problems."]},
  {h:"Before they leave",tag:"NICE NG143",items:[
   "Do not give oral antibiotics for fever without an apparent source.",
   "In a child aged 3 months or older with fever and no source, a period of observation in hospital can help tell serious from non-serious illness.",
   "Green features only: home care with advice and a safety net. Amber or red and no diagnosis: safety net (see the universal card) or specialist assessment."]}],
 ref:"NICE NG143 (updated 2019), read in full 15 October 2026."},

{id:"p_sepsis",set:["paeds"],name:"Suspected sepsis under 16",kw:"sepsis child paediatric septic shock lactate antibiotics ng254",
 why:"Age-specific thresholds. The adult NEWS2 pathway does not apply to children.",
 secs:[
  {h:"Assessment",tag:"NICE NG254",items:[
   "Under 12: assess temperature, heart rate, respiratory rate, level of consciousness, oxygen saturation and capillary refill. Ages 12 to 15: add blood pressure. Under 5: measure BP if heart rate or capillary refill is abnormal and a correctly sized cuff is available.",
   "Consider an early warning score for anyone under 16 with suspected sepsis, in any setting.",
   "Risk is graded using age-specific tables of respiratory rate, heart rate and other criteria (high risk, moderate to high risk). Use the tables in NG254 for the child's age, because the thresholds change across ages.",
   "Interpret heart rate in context. Sepsis may present without a high temperature."]},
  {h:"Actions",tag:"NICE NG254",items:[
   "Any high risk criterion in hospital: give antibiotics within 1 hour of meeting the criterion.",
   "Under 12 with any high risk criterion and lactate above 4 mmol/L: IV fluid bolus without delay, within 1 hour.",
   "Under 12 with 2 or more moderate to high risk criteria and lactate above 2 mmol/L: treat as if a high risk criterion were met.",
   "Under 16 with any high risk criterion who does not respond within 1 hour of any intervention: alert a consultant to attend in person."]}],
 ref:"NICE NG254 (November 2025), key recommendations rechecked 15 October 2026. Use the full age tables and your trust pathway.",
 path:["sepsis","u16","See where NG254 sits in the sepsis pathway"]},

{id:"p_bronch",set:["paeds"],name:"Bronchiolitis",kw:"bronchiolitis infant baby breathing rsv feeding oxygen apnoea",
 why:"Infants under 2, peaking in winter. Oxygen thresholds changed in 2021.",
 secs:[
  {h:"Do not discharge yet if",tag:"NICE NG9 (2021 update)",items:[
   "Any observed or reported apnoea. Young infants, especially under 6 weeks, can present with apnoea alone.",
   "SpO2 persistently below 90% in air (age 6 weeks or older), or below 92% in babies under 6 weeks or with underlying conditions.",
   "Feeding at 50 to 75% of usual intake or less, signs of dehydration, or severe respiratory distress (grunting, marked recession, high respiratory rate).",
   "Risk factors for severe disease: age under 3 months, prematurity (especially under 32 weeks), chronic lung or heart disease, immunodeficiency, neuromuscular disease, or significant parental concern."]},
  {h:"Check",tag:"NICE NG9 and practice",items:[
   "Respiratory rate, work of breathing, SpO2, hydration (feeds and wet nappies), and apnoea history. Think of pneumonia or sepsis if the picture does not fit.",
   "Management is supportive: oxygen if needed, fluids or nasogastric feeding if intake is low. NICE advises against routine antibiotics, steroids, bronchodilators or chest physiotherapy.",
   "Do not rely on a single saturation. Observe, including during a feed, before deciding."]},
  {h:"Before they leave",tag:"NICE NG9 and practice",items:[
   "SpO2 at or above 90% in air, feeding adequately, no recent apnoea, and parents confident to look after the child.",
   "Explain the usual course (worse for the first 3 to 5 days, cough for up to several weeks). Return for worse breathing, feeding under half of normal, no wet nappy for 12 hours, pauses in breathing, or exhaustion.",
   "Keep them away from smoke."]}],
 ref:"NICE NG9, 2021 oxygen threshold update, read via NHS regional guidance and summaries on 15 October 2026. Confirm exact wording on the NICE page."},

{id:"p_croup",set:["paeds"],name:"Croup",kw:"croup stridor barking cough dexamethasone child",
 why:"Common, usually mild, and treated with a single steroid dose. Observe until stridor free at rest.",
 secs:[
  {h:"Assess",tag:"NICE CKS, BNFC",items:[
   "Barking cough and inspiratory stridor in a child aged about 6 months to 3 years. Keep them calm with their carer. Do not examine the throat.",
   "Severity: stridor only when upset (mild), stridor at rest (moderate), biphasic stridor with severe recession, agitation or tiring (severe or life-threatening). The Westley score is widely used.",
   "Consider other causes of stridor if the child is unwell, drooling, has a high fever, or an unusual picture: epiglottitis, bacterial tracheitis, foreign body, anaphylaxis, retropharyngeal abscess."]},
  {h:"Treatment",tag:"NICE CKS, BNFC",items:[
   "A single dose of oral dexamethasone 0.15 mg/kg is the recommended starting dose for any child with croup. Prednisolone 1 mg/kg is an alternative.",
   "Severe or life-threatening croup: nebulised adrenaline (0.4 ml/kg of 1 in 1000, up to 5 ml) and call senior and anaesthetic help early.",
   "Doses from the NICE CKS and BNFC. Check the BNF for children."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Stridor free at rest, comfortable breathing, drinking, and an observation period after steroids (and longer after adrenaline, in case symptoms return) that follows your protocol.",
   "Written information on the usual course, and a warning to return urgently for stridor at rest, drooling, a child who looks tired or is struggling to breathe."]}],
 ref:"NICE CKS and BNFC dosing as quoted in NHS protocols, 15 October 2026. Observation times are protocol specific."},

{id:"p_asthma",set:["paeds"],name:"Wheeze and asthma in a child",kw:"asthma wheeze child peak flow salbutamol steroids inhaler",
 why:"BTS/SIGN gives clear discharge standards. Under-5 doses differ, so use the full pathway.",
 secs:[
  {h:"Severity (over 5 years)",tag:"BTS/SIGN 158",items:[
   "Moderate: SpO2 92% or above, peak flow 50% or more, no severe features.",
   "Acute severe: SpO2 below 92%, peak flow 33 to 50%, heart rate over 125, respiratory rate over 30, or using accessory neck muscles.",
   "Life-threatening: SpO2 below 92% with any of the life-threatening features such as peak flow below 33%.",
   "Treat with a beta-2 agonist via a spacer (one puff at a time, up to 10 puffs), oral prednisolone, and reassess within 1 hour."]},
  {h:"Before they leave (over 5 years)",tag:"BTS/SIGN 158",items:[
   "Continue prednisolone daily until recovery, minimum 3 to 5 days.",
   "Written asthma action plan provided and inhaler technique checked.",
   "GP follow-up within 48 hours.",
   "Hospital asthma clinic follow-up in 4 to 6 weeks if this is the second or subsequent attack in the past 12 months."]},
  {h:"Younger children",tag:"BTS/SIGN 158",items:[
   "Under 5 years: severity thresholds and steroid doses differ. Follow the BTS/SIGN pathway for under 5s and the BNF for children. Consider viral-induced wheeze and bronchiolitis in infants."]}],
 ref:"BTS/SIGN 158 asthma guideline (2019), rechecked 15 October 2026 for the over 5 pathway."},

{id:"p_gast",set:["paeds"],name:"Vomiting and diarrhoea in a child",kw:"gastroenteritis vomiting diarrhoea dehydration child ors under 5",
 why:"Dehydration is the harm. Assess it properly and rehydrate orally where you can.",
 secs:[
  {h:"Do not discharge yet if",tag:"NICE CG84",items:[
   "Clinical shock, or red flag symptoms or signs of dehydration: appears unwell or is deteriorating, altered responsiveness (irritable or lethargic), sunken eyes, tachycardia, tachypnoea, or reduced skin turgor.",
   "A baby under 3 months with a temperature of 38 degrees C or above.",
   "Bile-stained vomit, severe or localised abdominal pain, abdominal distension, blood in the stool with systemic illness, or an alternative diagnosis (appendicitis, intussusception, UTI, DKA, meningitis).",
   "Unable to keep oral fluids down despite a trial of ORS."]},
  {h:"Check",tag:"NICE CG84",items:[
   "Assess for clinical dehydration and shock with the CG84 table. Take risk factors into account, including age under 1 year (particularly under 6 months) and malnutrition.",
   "Without clinical dehydration: continue usual feeds, and offer ORS as supplemental fluid to those at higher risk.",
   "With clinical dehydration: low-osmolarity ORS (240 to 250 mOsm/L) and reassess regularly. Intravenous fluids if red flags and the child deteriorates despite oral rehydration.",
   "Consider giving 5 ml/kg of ORS after each large watery stool to prevent dehydration recurring."]},
  {h:"Before they leave",tag:"NICE CG84",items:[
   "Rehydrated, drinking and passing urine, and parents shown how to give ORS and how to recognise dehydration.",
   "Exclude from nursery or school while they have diarrhoea or vomiting. Hygiene advice.",
   "Safety net: not able to keep fluids down, fewer wet nappies, sunken fontanelle or eyes, drowsy or floppy, blood in the stool, bilious vomiting, or the parents are worried."]}],
 ref:"NICE CG84, rechecked 15 October 2026."},

{id:"p_uti",set:["paeds"],name:"Urinary tract infection in a child",kw:"uti urine infection child baby dipstick fever pyelonephritis",
 why:"Hard to spot in the young. Get a proper sample before antibiotics.",
 secs:[
  {h:"Do not discharge yet if",tag:"NICE NG224",items:[
   "A baby under 3 months with a suspected UTI: refer to paediatric specialist care and send a urine sample for urgent microscopy and culture.",
   "Any red or amber feature on the fever traffic light, signs of sepsis, vomiting and unable to take oral antibiotics, or a child who is seriously unwell."]},
  {h:"Check",tag:"NICE NG224, NG143",items:[
   "Test urine in children under 5 with fever and no other source (NG143 sets out when). Ask about dysuria, frequency, new bedwetting, offensive or cloudy urine, haematuria, abdominal or loin pain, and previous UTI.",
   "Collect a clean-catch sample if possible. If not, use a method set out in NG224. Take the sample before antibiotics and avoid delay in testing it.",
   "Interpret the dipstick (nitrite and leukocyte esterase) as NG224 sets out. A positive leukocyte esterase alone may mean infection outside the urinary tract.",
   "Ultrasound: needed in the acute phase for an atypical UTI (for example seriously unwell, failure to respond within 48 hours, or a non-E. coli organism). Follow NG224 for later imaging."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Antibiotic per the NICE antimicrobial guideline and local resistance, with a dose per kg. A plan to review the culture.",
   "Hydration advice and a safety net: persisting fever after 48 hours, vomiting, worsening pain or being drowsy."]}],
 ref:"NICE NG224 and NG143, rechecked 15 October 2026 for the main recommendations."},

{id:"p_abdo",set:["paeds"],name:"Abdominal pain in a child",kw:"abdominal pain child appendicitis intussusception torsion constipation",
 why:"The surgical problems you must not miss: appendicitis, intussusception, torsion, obstruction.",
 secs:[
  {h:"Do not discharge yet if",tag:"Good practice",items:[
   "Peritonism, guarding, pain on moving or hopping, persistent localised right iliac fossa pain, or rebound tenderness.",
   "Bile-stained (green) vomiting: malrotation or obstruction until proven otherwise.",
   "Intermittent severe pain with drawing up of the legs, pallor, lethargy, or red-currant jelly stool: intussusception.",
   "Testicular pain, or abdominal pain in a boy without examining the testes: torsion.",
   "A shocked, febrile or septic-looking child. Possible DKA (abdominal pain, vomiting and fast breathing).",
   "A girl of childbearing age with pain: pregnancy test. Ovarian torsion and ectopic are possible."]},
  {h:"Check",tag:"Good practice",items:[
   "Full observations, hydration, abdominal examination including hernial orifices and genitalia, and a urine dipstick.",
   "Capillary glucose and ketones if vomiting and breathing fast. Consider bloods and ultrasound guided by the picture. Early surgical review for suspected appendicitis, torsion or intussusception.",
   "Constipation is common but a diagnosis of exclusion in an unwell child."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Pain controlled, eating and drinking, an examination that has not worsened on repeat, and parents who know to return for worsening pain, vomiting (especially green), fever, a swollen abdomen, blood in the stool, or a child who becomes drowsy."]}],
 ref:"Good practice. Not rechecked against live guidance."},

{id:"p_head",set:["paeds"],name:"Head injury in a child",kw:"head injury child concussion ct fall baby bruise",
 why:"CT criteria differ from adults. Think of non-accidental injury in every infant.",
 secs:[
  {h:"CT head within 1 hour if any of",tag:"NICE NG232",items:[
   "Suspicion of non-accidental injury. Post-traumatic seizure.",
   "GCS below 14 on initial ED assessment (below 15 for babies under 1 year using the paediatric GCS), or GCS below 15 at 2 hours after injury.",
   "Suspected open or depressed skull fracture, or tense fontanelle. Any sign of basal skull fracture. Under 1 year with a bruise, swelling or laceration over 5 cm on the head.",
   "More than 1 of: witnessed loss of consciousness over 5 minutes, abnormal drowsiness, 3 or more discrete vomits, dangerous mechanism (high-speed collision, fall over 3 m, high-speed projectile), or amnesia over 5 minutes."]},
  {h:"Observation and discharge",tag:"NICE NG232",items:[
   "Only 1 of the risk factors above: observe for at least 4 hours from the time of injury. CT within 1 hour if GCS falls below 15, there is further vomiting, or further abnormal drowsiness.",
   "Discharge only when GCS is 15 (consciousness normal for age), there is no other reason to admit, and a responsible adult can supervise.",
   "Give verbal and printed advice including return criteria. Refer for a safeguarding assessment if there are concerns."]},
  {h:"Always ask",tag:"Good practice",items:[
   "Does the mechanism fit the child's age and development? A baby who cannot roll or crawl should not have fallen from a height without an explanation. Any delay in presentation or changing story means think of non-accidental injury."]}],
 ref:"NICE NG232, rechecked 15 October 2026."},

{id:"p_nai",set:["paeds"],name:"Suspected non-accidental injury",kw:"safeguarding non-accidental injury nai child abuse bruising neglect maltreatment burn",
 why:"If you are worried, do not discharge. Senior paediatric and safeguarding input comes first.",
 secs:[
  {h:"Features that should alert you",tag:"NICE CG89",items:[
   "Suspect maltreatment for bruising in the shape of a hand, ligature, stick, teeth, grip or implement, bruising or petechiae with an unsuitable explanation, and bruising in a child who is not independently mobile.",
   "Suspect maltreatment for burns or scalds with an unsuitable explanation, lacerations, abrasions or scars with an unsuitable explanation, and signs of spinal injury without major accidental trauma.",
   "Suspect for an intra-abdominal or intrathoracic injury without major confirmed accidental trauma, where there is no or an unsuitable explanation or a delay in presentation. There may be no external bruising.",
   "Consider neglect for an animal bite on an inadequately supervised child. Consider maltreatment for hypothermia with an unsuitable explanation.",
   "Be aware that alerting features in children with disabilities can also be features of the disability, which makes identification harder."]},
  {h:"Bruising in under 4 year olds: TEN-4-FACESp",tag:"JAMA Netw Open 2021",items:[
   "Any bruise on the Torso, Ears or Neck, or the Frenulum, Angle of jaw, fleshy Cheeks, Eyelids or Subconjunctivae, in a child under 4 years.",
   "Any bruise anywhere on an infant aged 4.99 months or younger.",
   "Any patterned bruise.",
   "The rule was 95.6% sensitive and 87.1% specific for abuse in the validation study. A positive finding warrants further evaluation, not a diagnosis. 'Those who do not cruise rarely bruise.'"]},
  {h:"What to do",tag:"NICE CG89 and practice",items:[
   "Discuss your concern with a senior and the named or designated safeguarding professional. If you suspect maltreatment, refer to children's social care under local arrangements. NICE advises excluding maltreatment only when a suitable explanation is found.",
   "Record the history verbatim, who gave it and when, the developmental stage, and a body map with measurements. Do not discharge until the senior paediatric review is done.",
   "Look for a medical cause (for example a bleeding disorder) but do not delay the referral while you look.",
   "Skeletal survey and other investigations are decided by the paediatric and safeguarding team, usually including all children under 2 with suspected physical abuse.",
   "Refer on suspicion, not certainty. Be open with the family about the referral unless doing so would put the child at risk."]}],
 ref:"NICE CG89 (when to suspect child maltreatment), TEN-4-FACESp (Pierce et al., 2021). Local pathway and referral steps are good practice."},

{id:"p_limb",set:["paeds"],name:"Limb injury and the limping child",kw:"limp limping child fracture pulled elbow septic arthritis sufe toddler fracture",
 why:"A fracture in a child who does not yet walk is a safeguarding issue. A limp with fever is septic arthritis until proven otherwise.",
 secs:[
  {h:"Do not discharge yet if",tag:"NICE NG143 and practice",items:[
   "Fever with a swollen limb or joint, not using the limb, or not weight-bearing: consider septic arthritis or osteomyelitis (NICE NG143).",
   "Any fracture in a child who is not walking, a rib, metaphyseal or skull fracture in an infant, or a history that does not fit: think of non-accidental injury and use the safeguarding card.",
   "Hip or knee pain in a child aged about 8 to 15, especially if overweight: slipped upper femoral epiphysis. Examine the hip.",
   "Neurovascular compromise, an open fracture, or compartment syndrome signs.",
   "Pain out of proportion, night pain, systemic upset, or limp lasting beyond a few days."]},
  {h:"Check",tag:"Good practice",items:[
   "Examine the joint above and below. Find the point of maximal tenderness. Check the spine and abdomen as well as the limb.",
   "Temperature, observations, and bloods (FBC, CRP) if febrile or unwell. Ultrasound of the hip for irritable hip.",
   "X-ray to the local protocol. A normal X-ray with focal bone tenderness (for example a toddler's fracture) is managed as a fracture.",
   "Pulled elbow: classic history of traction, child holding the arm still. Reduce, and check they use the arm afterwards. No X-ray if the history is typical."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Neurovascular status documented before and after any splint. Analgesia with a weight-based dose.",
   "Fracture clinic or paediatric orthopaedic follow-up booked and explained, and written advice on cast care and return signs."]}],
 ref:"NICE NG143 (septic arthritis features rechecked 15 October 2026). The rest is good practice."},

{id:"p_seiz",set:["paeds"],name:"Seizures and febrile convulsions",kw:"seizure febrile convulsion fit child epilepsy first seizure",
 why:"Most febrile convulsions are simple and benign. Check for the ones that are not.",
 secs:[
  {h:"Do not discharge yet if",tag:"NICE NG143 and practice",items:[
   "Status epilepticus, focal neurological signs or a focal seizure: NICE puts these in the red fever column. Consider meningitis and herpes simplex encephalitis.",
   "Not back to normal after the seizure, or drowsiness that does not clear.",
   "Features of serious infection (use the fever traffic light), neck stiffness, bulging fontanelle or non-blanching rash.",
   "Under 6 months or over 6 years, a seizure longer than 15 minutes, a second seizure in the same illness, or a focal seizure.",
   "A first afebrile seizure."]},
  {h:"Check",tag:"Good practice",items:[
   "Capillary glucose. Temperature and a source of fever. Neurological examination, including fontanelle and signs of meningism.",
   "NICE advises antipyretics do not prevent febrile convulsions and should not be used for that purpose.",
   "Sodium, calcium and magnesium if no clear cause. Think of head injury, drugs and toxins, and consider non-accidental injury in infants."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "A simple febrile convulsion with full recovery and a source found: parents are given a clear explanation, first aid advice (recovery position, time the seizure, call 999 if it lasts 5 minutes), and written information.",
   "First afebrile seizure: paediatric review and referral as per local pathway before discharge."]}],
 ref:"NICE NG143 (red features, antipyretic advice) rechecked 15 October 2026. Discharge criteria are good practice."},

{id:"p_ingest",set:["paeds"],name:"Ingestion and poisoning",kw:"ingestion poisoning button battery magnet toxbase overdose child swallowed",
 why:"Toddlers swallow things. Teenagers take overdoses on purpose. Both need a plan before discharge.",
 secs:[
  {h:"Do not discharge yet if",tag:"Good practice",items:[
   "Button (disc) battery or more than one magnet swallowed, or a magnet plus metal: emergency imaging and urgent surgical or ENT advice. Do not wait for symptoms.",
   "A substance known to be dangerous in one dose or a small number of tablets: for example iron, paracetamol, opioids, tricyclics, sulfonylureas, calcium-channel blockers or button batteries. Check TOXBASE.",
   "Reduced consciousness, vomiting blood, drooling or stridor, breathing difficulty, or an abnormal ECG.",
   "A teenager with deliberate ingestion: use the self-harm pathway. Capacity and a psychosocial assessment come before discharge."]},
  {h:"Check",tag:"Good practice",items:[
   "What, how much, when, and how sure are you. Bring the packaging. Weigh the child.",
   "Use TOXBASE or the National Poisons Information Service for every ingestion. Do not rely on memory for treatment thresholds or antidotes.",
   "Observations, glucose, ECG for anything cardiotoxic, and levels or imaging as TOXBASE advises."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "The observation period TOXBASE specifies has been completed and the child is well.",
   "Prevention advice: lock away medicines and batteries, and consider a safeguarding concern if ingestions are repeated or the supervision seems inadequate."]}],
 ref:"Good practice. Use TOXBASE for decisions. Not rechecked against live guidance."},

{id:"p_consent",set:["paeds"],name:"Consent, confidentiality and young people",kw:"consent gillick fraser confidentiality young person 16 17 unaccompanied capacity",
 why:"Who can agree to treatment, who can you talk to, and when must you break confidence.",
 secs:[
  {h:"Capacity and consent",tag:"Good practice (GMC 0 to 18 guidance)",items:[
   "Aged 16 to 17: presumed to have capacity to consent to their own treatment. The Mental Capacity Act 2005 applies from age 16.",
   "Under 16: a child who understands the decision, its risks and alternatives, and can weigh them up can consent (Gillick competence). Assess and document it for each decision.",
   "A competent young person can ask for confidentiality, including about contraception or sexual health, but safeguarding concerns override it. Use the Fraser criteria for contraceptive advice.",
   "If the child lacks competence, a person with parental responsibility consents. Check who has parental responsibility and who actually brought the child."]},
  {h:"Unaccompanied and concerning situations",tag:"Good practice",items:[
   "A child with no adult: find out who is responsible for them. Do not discharge a young child alone.",
   "Refusal of treatment by a young person: think about competence, the seriousness of the condition, and get senior and legal advice early.",
   "Self-harm or mental health crisis in a young person: psychosocial assessment before discharge, and involve CAMHS (NICE NG225 applies to all ages).",
   "Think about abuse, exploitation, trafficking, pregnancy in a young teenager, and sexual activity under 13 (always a safeguarding concern)."]}],
 ref:"Good practice, based on GMC 0 to 18 years guidance and NICE NG225. Not rechecked against live guidance. Follow your trust policy."}
];

var CARDS3 = [

{id:"m_all",set:["minors"],name:"Every minors patient: before discharge",kw:"minors universal discharge fracture plaster splint neurovascular follow-up",
 why:"The checks that stop missed fractures, tight casts and unplanned returns.",
 secs:[
  {h:"Before they go home",tag:"Good practice",items:[
   "Neurovascular status below the injury checked and documented before and after any splint, plaster or reduction: pulses, capillary refill, sensation, movement.",
   "You have seen the images and the report. If the clinical picture says fracture but the X-ray is normal, treat as a fracture and arrange review. Classic misses are the scaphoid, radial head, base of the fifth metatarsal, and Salter-Harris type I injuries in children.",
   "Pregnancy status considered before X-rays of the abdomen, pelvis or lumbar spine.",
   "Analgesia that works, with an oral supply and clear instructions. Check renal function, ulcer history, anticoagulation and asthma before an NSAID.",
   "Splint or plaster advice: elevate, keep dry, and return urgently for pain out of proportion, numbness, tingling, colour change or a tight cast (compartment syndrome).",
   "Named follow-up: fracture clinic or virtual fracture clinic with a time, or an explicit 'no follow-up needed' with the reason. The patient knows who will contact them.",
   "Tetanus status checked for any wound or burn.",
   "Why did they fall or get hurt? Syncope, alcohol, frailty and medicines matter. A fragility fracture over 50 means think about bone health and falls (NICE NG249).",
   "Ask about assault or domestic abuse, in private, when the injury or the story does not fit. Think about safeguarding for children and vulnerable adults.",
   "Head injury with an anticoagulant or antiplatelet: use the head injury criteria.",
   "Fit note, work advice and driving advice. A sling or plaster means check insurance and DVLA guidance."]},
  {h:"Safety net",tag:"Good practice",items:[
   "Return for increasing pain, numbness, swelling, discolouration, fever, wound redness or discharge, or any new weakness."]}],
 ref:"Good practice. NICE NG249 for falls and fragility fracture. Not rechecked against live guidance."},

{id:"m_ankle",set:["minors"],name:"Ankle and foot injury",kw:"ankle foot injury sprain ottawa fracture achilles metatarsal",
 why:"The most common minors injury. The Ottawa rules tell you who needs an X-ray.",
 secs:[
  {h:"Ottawa ankle and foot rules",tag:"Good practice",items:[
   "Ankle X-ray if pain in the malleolar zone and any of: bone tenderness at the posterior edge or tip of the lateral malleolus or the medial malleolus (lower 6 cm), or unable to weight-bear for four steps both immediately and in the department.",
   "Foot X-ray if pain in the midfoot zone and any of: bone tenderness at the base of the fifth metatarsal or the navicular, or unable to weight-bear for four steps both immediately and in the department.",
   "The rules do not apply in children under 5 to 7 years, intoxicated patients, multiple injuries, or neurological deficit. Use clinical judgement."]},
  {h:"Do not miss",tag:"Good practice",items:[
   "Achilles rupture: palpable gap, weak plantar flexion, positive Simmonds (calf squeeze) test. Needs an equinus splint and orthopaedic review.",
   "Proximal fibula tenderness with ankle injury (Maisonneuve), widened mortice or syndesmosis injury, and talar or calcaneal fractures.",
   "Open wounds near the joint, dislocation, a poor foot pulse, or numbness: urgent senior and orthopaedic review.",
   "Unstable or displaced fractures need orthopaedic input before discharge."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Able to weight-bear or safely mobilise with crutches, which they have been taught to use. Splint or boot as appropriate.",
   "VTE risk considered if the lower limb is immobilised, per your local policy.",
   "Follow-up named (fracture clinic or physiotherapy) and return advice given."]}],
 ref:"Ottawa ankle rules (standard teaching). Not rechecked against live guidance."},

{id:"m_knee",set:["minors"],name:"Knee injury",kw:"knee injury patella ligament acl meniscus ottawa dislocation",
 why:"Most are soft tissue injuries, but a few hide a fracture, an extensor mechanism rupture or a vascular injury.",
 secs:[
  {h:"Ottawa knee rules",tag:"Good practice",items:[
   "X-ray if any of: age 55 or over, isolated tenderness of the patella, tenderness at the head of the fibula, unable to flex to 90 degrees, or unable to weight-bear for four steps both immediately and in the department."]},
  {h:"Do not miss",tag:"Good practice",items:[
   "Cannot do a straight leg raise or has a palpable gap: extensor mechanism rupture.",
   "A locked knee, or a large haemarthrosis within hours of injury: ligament tear or fracture, and needs orthopaedic review.",
   "Knee dislocation, even if it has reduced itself: check popliteal artery (pulses, ankle-brachial pressure if in doubt) and nerve injury.",
   "A hot swollen joint with fever: septic arthritis. Aspirate before antibiotics where possible.",
   "Patella dislocation: check reduction and imaging. Tibial plateau and Segond fractures can be subtle."]},
  {h:"Before they leave",tag:"Good practice",items:[
   "Stable, weight-bearing or on crutches, with a brace if advised. VTE risk considered per local policy.",
   "Follow-up in the knee or fracture clinic within 1 to 2 weeks if you suspect a ligament or meniscal injury, with advice on when to return urgently."]}],
 ref:"Ottawa knee rules (standard teaching). Not rechecked against live guidance."},

{id:"m_wrist",set:["minors"],name:"Wrist and hand injury",kw:"wrist hand scaphoid fall outstretched hand finger tendon boxer fight bite colles",
 why:"Scaphoid fractures and hand tendon injuries are the commonest sources of missed injury and complaints.",
 secs:[
  {h:"Suspected scaphoid fracture",tag:"NICE NG38, BSSH",items:[
   "Suspect after a fall on an outstretched hand with snuffbox tenderness, tenderness over the scaphoid tubercle, or pain on axial loading of the thumb.",
   "Request a dedicated scaphoid series of radiographs, not a standard wrist film.",
   "Clinically suspected but normal X-ray: immobilise the wrist in a splint, tell the patient they may have a fracture, and arrange definitive imaging. NICE says to consider MRI as first-line imaging after clinical examination.",
   "Confirmed fracture: below-elbow backslab and refer to the specialist clinic. Do not discharge with no plan."]},
  {h:"Other injuries to check",tag:"Good practice",items:[
   "Distal radius fracture: displacement, median nerve function, and skin tenting.",
   "Finger injuries: test each flexor and extensor tendon separately, digital nerve sensation, capillary refill, and nail bed injury.",
   "Fight bite (clenched-fist injury over the knuckle): treat as a human bite with possible joint or tendon involvement. Needs antibiotics, exploration and hand surgical review. Do not simply suture.",
   "Remove rings early before swelling.",
   "Mallet finger, jersey finger and Bennett fractures need hand clinic follow-up."]},
  {h:"Before they leave",tag:"Good practice",items:[

}
function view(keep){
  var y=window.scrollY,n=node(S.cur),h=mbar()+trail();
  if(n.t==="m")h+=menu(n);else if(n.t==="q")h+=question(n);else if(n.t==="c")h+=calc(n);else if(n.t==="n")h+=numNode(n);else h+=result(n);
  app.innerHTML=h;
  if(keep){window.scrollTo(0,y);return;}
  var hd=app.querySelector("h1");
  if(hd){hd.setAttribute("tabindex","-1");try{hd.focus({preventScroll:true});}catch(e){}}
  window.scrollTo(0,0);
}
function openMod(id,nodeId,viaPush){
  if(viaPush)S.hist.push(snapshot());
  S.mod=modById(id);S.stack=[];S.screen={t:"mod"};S.cur=nodeId&&S.mod.nodes[nodeId]?nodeId:S.mod.start;view();
}
function goTo(to,label){
  if(to.charAt(0)==="@"){var p=to.slice(1).split(":");openMod(p[0],p[1],true);return;}
  var n=node(S.cur);
  S.stack.push({id:S.cur,q:n.q||n.title||S.mod.name,a:label});
  S.cur=to;view();
}
function back(){
  if(!S.stack.length){popScreen();return;}
  S.cur=S.stack.pop().id;view();
}

/* ---- events ---- */
app.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="home"){toHome();return;}
  if(a==="pop"){popScreen();return;}
  if(a==="list"){S.q="";go({t:"list",id:b.getAttribute("data-id")});return;}
  if(a==="card"){go({t:"card",id:b.getAttribute("data-id")});return;}
  if(a==="cpath"){var c=cardById(b.getAttribute("data-id"));openMod(c.path[0],c.path[1],true);return;}
  if(a==="open"){openMod(b.getAttribute("data-id"),null,true);return;}
  if(a==="back"){back();return;}
  if(a==="restart"){openMod(S.mod.id);return;}
  if(a==="jump"){var i=+b.getAttribute("data-i");S.cur=S.stack[i].id;S.stack=S.stack.slice(0,i);view();return;}
  if(a==="opt"){var n=node(S.cur),o=(n.opts||n.items)[+b.getAttribute("data-i")];goTo(o.go,o.l);return;}
  if(a==="btn"){var n2=node(S.cur),bt=n2.buttons[+b.getAttribute("data-i")];goTo(bt.go,bt.l);return;}
  if(a==="sel"){var n3=node(S.cur),g=n3.groups[+b.getAttribute("data-g")],v=cstate(),oi=+b.getAttribute("data-o");
    if(g.type==="seg"){v[g.k]=oi;}else{v[g.k]=(v[g.k]===oi)?null:oi;}view(true);return;}
  if(a==="chk"){var n4=node(S.cur),g2=n4.groups[+b.getAttribute("data-g")],v2=cstate();v2[g2.k]=!v2[g2.k];view(true);return;}
  if(a==="next"){var n5=node(S.cur),sc=calcScore(n5);if(!sc.done)return;var r=n5.done(sc.sum,{three:sc.three,v:sc.v});goTo(r[0],r[1]);return;}
  if(a==="nsel"){var st=nstate(),k2=b.getAttribute("data-k"),o2=+b.getAttribute("data-o");st[k2]=o2;
    var sibs=b.parentNode.querySelectorAll(".chip");for(var j=0;j<sibs.length;j++){sibs[j].setAttribute("aria-pressed",String(j===o2));}
    document.getElementById("nres").innerHTML=ncompute(node(S.cur));return;}
  if(a==="tick"){var kk=b.getAttribute("data-k");S.tick[kk]=!S.tick[kk];b.setAttribute("aria-pressed",String(!!S.tick[kk]));return;}
});
app.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="srch"){S.q=t.value;document.getElementById("lbody").innerHTML=listItems(S.screen.id);return;}
  if(t.hasAttribute&&t.hasAttribute("data-k")&&t.tagName==="INPUT"){
    nstate()[t.getAttribute("data-k")]=t.value;
    document.getElementById("nres").innerHTML=ncompute(node(S.cur));
  }
});

home();
})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
